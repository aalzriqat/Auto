name: SPIKE SCRUM-892 r10 tripwire runtime reads (never merged)

# PR #757 round 10, before merge. Runs that head's scripts/localConvexBackend.mjs
# against the pinned image on a GitHub runner, to prove at runtime what the unit
# tests can only model:
#   - the admin key may call _system/cli/queryEnvironmentVariables and
#     _system/frontend/listDeploymentEventsFromTime;
#   - GET /api/v1/get_canonical_urls returns exactly the two local origins;
#   - the seed writes no audit row, so `verify` after it is green.
# The seed is scripts/e2ePreviewBootstrap.mjs itself (main, then the --assert-only
# path), with only the Clerk email-to-id lookup replaced by placeholder ids, so no
# Clerk secret is needed.
# Negative control: an env change after `mark` must turn `verify` red. Cause control:
# restoring that value must leave `verify` red, because the audit row moved.
# Nothing secret is printed.
on:
  push:
    branches: ["claude/scrum892-r5-escalation-spike"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-892-r10-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

jobs:
  tripwire:
    if: github.ref == 'refs/heads/claude/scrum892-r5-escalation-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start the local Convex backend
        run: node scripts/localConvexBackend.mjs start

      - name: Set the trusted environment plan
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy this checkout's convex/ and mint the marker
        run: node scripts/localConvexBackend.mjs deploy

      - name: Mark
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # The swarm's own seed code (main, then the --assert-only path), with only the
      # Clerk email-to-id lookup replaced by placeholder ids.
      - name: Seed and assert as the swarm does (scripts/e2ePreviewBootstrap.mjs)
        env:
          NEXT_PUBLIC_CONVEX_URL: "http://127.0.0.1:3210"
          E2E_LOGIN_USER: "spike-primary@example.test"
          E2E_APPROVER_USER: "spike-approver@example.test"
        run: |
          node --input-type=module -e '
          import { main, assertExistingE2EPreview } from "./scripts/e2ePreviewBootstrap.mjs";
          const ids = { "spike-primary@example.test": "user_spike892primary", "spike-approver@example.test": "user_spike892approver" };
          const resolveClerkUserId = async ({ email }) => ids[email];
          await main(process.env, { resolveClerkUserId });
          await assertExistingE2EPreview(process.env, { resolveClerkUserId });
          console.log("seed and assert completed");
          '

      - name: POSITIVE control 1 - verify is green after the seed
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: POSITIVE control 2 - verify again (stable across reads)
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: ATTACK - change a variable after mark
        run: node node_modules/convex/bin/main.js env set NEXT_PUBLIC_APP_URL "http://127.0.0.1:3001" --force

      - name: NEGATIVE control - verify must refuse the changed variable
        id: neg_change
        continue-on-error: true
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Restore the variable
        run: node node_modules/convex/bin/main.js env set NEXT_PUBLIC_APP_URL "$NEXT_PUBLIC_APP_URL" --force

      - name: CAUSE control - verify must still refuse after the restore (audit row moved)
        id: neg_restored
        continue-on-error: true
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Verdict
        env:
          NEG_CHANGE: ${{ steps.neg_change.outcome }}
          NEG_RESTORED: ${{ steps.neg_restored.outcome }}
        run: |
          set -euo pipefail
          echo "negative controls: changed=$NEG_CHANGE restored=$NEG_RESTORED"
          [ "$NEG_CHANGE" = failure ] && [ "$NEG_RESTORED" = failure ] || { echo "TRIPWIRE MISSED A CHANGE"; exit 1; }
          echo "RUNTIME READS OK; SEED LEFT VERIFY GREEN; CHANGE AND RESTORED CHANGE BOTH TURNED VERIFY RED"

      - name: Remove the local Convex backend
        if: always()
        run: node scripts/localConvexBackend.mjs stop
