name: Security

# Security tooling. Findings are REPORTED, not enforced: every scanner step
# carries continue-on-error, and none of these jobs is in main's required
# status checks. Verified against the live branch-protection API, which lists
# unit-and-integration, type-check, convex-backend, lint, secret-scan,
# dependency-audit, dealer-worker, Analyze (javascript-typescript),
# production-build and mobile-and-shared — plus zero rulesets. So a red job
# here does not block a merge today. Do not read "DASHBOARD" below as "gate".
#
# Three steps DO hard-fail their job, and all three are about whether the scan
# RAN, never about what it found: the manifest-classification check, the
# runtime-lock sanity check, and the toolchain report check. A crashed or empty
# scan must never be indistinguishable from a clean one.
#
# Gitleaks (secret scanning) already runs in test.yml's secret-scan job and is
# not duplicated here.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SAST — static analysis of application source for insecure patterns.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Semgrep (CE rulesets)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/nextjs \
            --config=p/react \
            --sarif --output=semgrep.sarif \
            --exclude=node_modules --exclude=.next --exclude=dealer-worker/node_modules \
            --exclude=graphify-out
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # SCA (runtime) — the primary dependency signal: packages that actually ship
  # or run. This is the only SCA job that reaches the Security dashboard, so it
  # is what a merge gate can meaningfully be built on.
  #
  # Three sources, each covering a graph the others cannot see:
  #   pnpm-lock.yaml                        — web + server + the mobile app's JS
  #   dealer-worker/package-lock.json       — the Cloudflare worker
  #   apps/mobile/android/app/gradle.lockfile — the Android release runtime
  #
  # Scanned explicitly rather than with `--recursive ./`, because a recursive
  # scan also picks up apps/mobile/android/gradle/verification-metadata.xml.
  # That file is Gradle's append-only artifact *checksum ledger*, and the key
  # point is that it is a MIXED ledger: it records every artifact Gradle ever
  # resolved, so build plugins (AGP, the Kotlin plugin), test-only jars (junit,
  # assertj, mockwebserver, robolectric), stale historical versions AND real
  # shipped runtime libraries all sit in it side by side, with nothing marking
  # which is which. 2232 components, against 444 that actually ship.
  #
  # So it cannot answer "is this in the APK?" in either direction. Measured on
  # this repo: it lists commons-io at 1.4, 2.4, 2.6 and 2.16.1 while only 1.4
  # ships, and its 95 advisories include GHSA-574f-3g2m-x479 (CVSS 9.3) against
  # org.bouncycastle:bcprov-jdk15to18:1.81 — which IS in the release runtime
  # graph, reached via bcutil-jdk15to18 under `project :expo`. Gating on the
  # ledger drowns the signal (289 of 301 findings); gating on nothing Android
  # would have demoted that Critical off the dashboard entirely.
  #
  # Hence the split: gate on the resolved release-runtime graph, and keep the
  # ledger as separate non-blocking supply-chain reporting in osv-toolchain.
  #
  # apps/* is a pnpm workspace member, so pnpm-lock.yaml covers the mobile
  # app's JS/React Native dependency graph. What it cannot cover is the Android
  # *native* AAR/JAR graph — androidx, com.facebook.react:react-android,
  # okhttp/okio, and everything the autolinked Expo modules and the Clerk
  # Android SDK drag in. Only Gradle can resolve that, which is what
  # apps/mobile/android/app/gradle.lockfile records. See
  # docs/security/dependency-scanning.md for how to regenerate it.
  osv-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Explicit lockfile lists go stale silently: a new workspace or worker
      # added later would simply never be scanned, and the job would stay
      # green. Fail loudly instead so the omission is visible.
      #
      # The invariant this enforces: every dependency source in the repo is
      # explicitly classified as either DASHBOARD (it ships or runs, so its
      # vulnerabilities belong on the Security tab) or REPORTING (build-machine
      # only), and anything unclassified fails CI until a human decides which.
      # Deliberately not "the three files we happen to have today" — this PR
      # itself adds a fourth, which is exactly the drift the step exists for.
      - name: Fail if an unclassified dependency manifest appeared
        run: |
          # DASHBOARD — scanned by this job and uploaded to code scanning.
          # This is the signal a merge gate should be built on; see the header
          # for why it does not block a merge today.
          gating=$(printf '%s\n' \
            "./apps/mobile/android/app/gradle.lockfile" \
            "./dealer-worker/package-lock.json" \
            "./pnpm-lock.yaml")
          # REPORTING — scanned by osv-toolchain, never uploaded. Build-machine
          # artifacts and mixed ledgers that cannot answer "does this ship?".
          reporting=$(printf '%s\n' \
            "./apps/mobile/android/gradle/verification-metadata.xml")
          expected=$(printf '%s\n%s\n' "$gating" "$reporting" | sed '/^$/d' | sort)
          actual=$(find . \
            \( -name node_modules -o -name .git -o -name .next \) -prune -o \
            \( -name 'pnpm-lock.yaml' -o -name 'package-lock.json' -o -name 'yarn.lock' \
               -o -name 'bun.lock' -o -name 'gradle.lockfile' -o -name 'buildscript-gradle.lockfile' \
               -o -name 'settings-gradle.lockfile' \
               -o -name 'npm-shrinkwrap.json' -o -name 'Gopkg.lock' -o -name '*.csproj' \
               -o -name 'Podfile.lock' -o -name 'Package.resolved' \
               -o -name 'verification-metadata.xml' -o -name 'pom.xml' -o -name 'go.mod' \
               -o -name 'Cargo.lock' -o -name 'requirements*.txt' -o -name 'poetry.lock' \
               -o -name 'uv.lock' -o -name 'pylock.toml' -o -name 'Pipfile.lock' -o -name 'pdm.lock' \
               -o -name 'composer.lock' -o -name 'Gemfile.lock' -o -name 'gems.locked' \
               -o -name 'packages.lock.json' -o -name 'packages.config' -o -name 'deps.json' \
               -o -name 'pubspec.lock' -o -name 'mix.lock' -o -name 'renv.lock' -o -name 'conan.lock' \
               -o -name 'cabal.project.freeze' -o -name 'stack.yaml.lock' \) \
            -print | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::An unclassified dependency manifest appeared (or a classified one moved)."
            echo "::error::Decide whether it SHIPS/RUNS (add to the gating list AND to the"
            echo "::error::osv-runtime scan-args below) or is BUILD-MACHINE ONLY (add to the"
            echo "::error::reporting list AND to the osv-toolchain scan-args). Do not just"
            echo "::error::silence this step — an unlisted manifest is scanned by nothing."
            echo "--- expected (classified) vs actual (found on disk) ---"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "All dependency manifests are classified."

      - name: Run OSV-Scanner (runtime dependencies)
        id: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Keep in sync with the `gating` list in the classification step above.
          scan-args: |-
            --output-file=osv-results.sarif
            --format=sarif
            --lockfile=pnpm-lock.yaml
            --lockfile=dealer-worker/package-lock.json
            --lockfile=apps/mobile/android/app/gradle.lockfile

      # Fail-closed, and the reason is specific rather than defensive.
      #
      # osv-scanner reports "found 0 packages" and exits 0 for a lockfile it can
      # read but that contains no entries. With three lockfiles on the command
      # line the overall scan still succeeds and still writes SARIF — carrying
      # only the pnpm findings. Reproduced: emptying gradle.lockfile drops all
      # three Android results, including GHSA-574f-3g2m-x479 (CVSS 9.3), and the
      # pinned category then marks them `fixed` with a green job and no signal
      # anywhere.
      #
      # The manifest guard above cannot catch it — it compares FILENAMES, never
      # content. Reachable by a bad lock regeneration, or by deleting the
      # activateDependencyLocking block in app/build.gradle, after which the
      # committed lock silently freezes forever.
      - name: Fail if the Android runtime lock is empty or no longer locked
        run: |
          lock=apps/mobile/android/app/gradle.lockfile
          entries=$(grep -c '=releaseRuntimeClasspath$' "$lock" || true)
          # Floor, not an exact count, so ordinary dependency churn does not
          # trip it. The real graph is ~444; anything under 300 means the lock
          # was truncated, emptied, or written for the wrong configuration.
          if [ "${entries:-0}" -lt 300 ]; then
            echo "::error::$lock has only ${entries:-0} releaseRuntimeClasspath entries (expected ~444)."
            echo "::error::A near-empty lock scans clean and would silently close the shipped-Android alerts."
            echo "::error::Regenerate: cd apps/mobile/android && ./gradlew :app:dependencies --write-locks"
            exit 1
          fi
          if ! grep -q 'activateDependencyLocking' apps/mobile/android/app/build.gradle; then
            echo "::error::Dependency locking is no longer activated in apps/mobile/android/app/build.gradle."
            echo "::error::The committed lock would then never change again, and this scan would report on a stale graph."
            exit 1
          fi
          echo "Android runtime lock present ($entries entries) and locking still active."

      - name: Fail if the runtime scan produced no SARIF
        if: always()
        run: |
          if [ ! -s osv-results.sarif ]; then
            echo "::error::osv-runtime produced no SARIF — the scan failed rather than finding nothing."
            exit 1
          fi
          jq -e '.runs[0].tool.driver.name' osv-results.sarif > /dev/null || {
            echo "::error::osv-results.sarif is not a well-formed SARIF report."; exit 1; }
          echo "Runtime SARIF present ($(jq '[.runs[0].results[]?] | length' osv-results.sarif) result(s))."

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          # Pinned explicitly. Without it, upload-sarif derives the analysis
          # category from workflow file + JOB NAME, and the existing analysis on
          # main is keyed `.github/workflows/security.yml:osv-scanner`. Renaming
          # the job to osv-runtime would therefore start a NEW category, leaving
          # the old one orphaned: its 289 gradle + 18 pnpm alerts would never be
          # closed at all, while the pnpm findings were re-created as new alerts
          # under the new key — more open alerts than before, which is the exact
          # opposite of the point. Pinning the old key updates the analysis in
          # place. NOTE: GitHub records the dropped ledger alerts as `fixed`
          # even though nothing was remediated — they are out of scope, not
          # resolved. See docs/security/dependency-scanning.md.
          # NOTE: this string is used VERBATIM as the analysis category --
          # upload-sarif does not prepend the workflow path to it. So it has to
          # be the full existing key, not the bare job name. Verified live:
          # main's analysis carries
          # category=".github/workflows/security.yml:osv-scanner", while a
          # bare `osv-scanner` produced category="osv-scanner" -- a THIRD
          # category that would have orphaned all 307 alerts and added 18 more.
          category: .github/workflows/security.yml:osv-scanner

  # SCA (Gradle artifact ledger) — supply-chain visibility for everything
  # Gradle has ever resolved for this project.
  #
  # NOT "build-machine artifacts only". verification-metadata.xml is a mixed
  # ledger: build plugins, test-only jars, stale versions and genuinely shipped
  # runtime libraries are all recorded in the same list with nothing
  # distinguishing them. It therefore cannot be used to decide what ships —
  # which is why it is not the gating signal, and equally why it is not thrown
  # away. What ships is gated on separately, from the resolved release-runtime
  # graph, in osv-runtime above.
  #
  # Non-blocking because a ledger advisory does not imply a shipped
  # vulnerability: the finding may be against a build plugin, a test jar, or a
  # version that is no longer resolved by anything. Overlap with a real shipped
  # vulnerability is expected, and osv-runtime surfaces that overlap on the
  # Security tab. Note neither job blocks a merge today — see the header.
  #
  # Note this job has no `security-events: write` — it cannot publish alerts
  # even by accident.
  osv-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run OSV-Scanner (Gradle build toolchain)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output-file=osv-toolchain.json
            --format=json
            --lockfile=apps/mobile/android/gradle/verification-metadata.xml

      # Without this, a crashed scanner and a clean scan are indistinguishable:
      # on a hard error osv-scanner returns before writing the report, so the
      # summary below would print "No report produced" and the job would stay
      # green forever. This job is the entire justification for keeping the
      # Gradle findings off the dashboard, so it has to fail when it did not
      # actually run.
      # Fail-closed. `continue-on-error` above is there so that *vulnerability
      # findings* do not block a merge — it must never also mean "the scanner
      # crashed and nobody noticed". On a hard error osv-scanner returns before
      # writing a report, so without this step a crashed scan and a clean scan
      # are indistinguishable and the job stays green forever.
      #
      # Checks three separate failure modes, because "file exists" is not the
      # same as "the scan ran": missing/empty, not valid JSON, and valid JSON
      # that does not actually carry a results array (e.g. an error object).
      - name: Fail if the toolchain scan did not run
        if: always()
        run: |
          if [ ! -s osv-toolchain.json ]; then
            echo "::error::osv-toolchain produced no report — the scan failed rather than finding nothing."
            exit 1
          fi
          if ! jq -e . osv-toolchain.json > /dev/null 2>&1; then
            echo "::error::osv-toolchain report is not valid JSON — treating as a failed scan."
            head -c 500 osv-toolchain.json
            exit 1
          fi
          if ! jq -e 'has("results")' osv-toolchain.json > /dev/null 2>&1; then
            echo "::error::osv-toolchain report has no 'results' key — the scanner did not complete a scan."
            head -c 500 osv-toolchain.json
            exit 1
          fi
          echo "Toolchain report present and well-formed ($(wc -c < osv-toolchain.json) bytes, $(jq '.results | length' osv-toolchain.json) result set(s))."

      - name: Summarise toolchain findings
        if: always()
        run: |
          {
            echo "### Gradle artifact-ledger advisories"
            echo
            echo "Every artifact Gradle has ever resolved for this project: build"
            echo "plugins, test-only jars, stale versions **and** shipped runtime"
            echo "libraries, with nothing marking which is which. Reported for"
            echo "supply-chain visibility only; not a merge gate."
            echo
            echo "What actually ships is gated separately, from"
            echo '`apps/mobile/android/app/gradle.lockfile`, in the **osv-runtime** job.'
            echo "Findings below may overlap with it — that overlap is real and blocks there."
            echo
            if [ -s osv-toolchain.json ]; then
              total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-toolchain.json 2>/dev/null || echo "?")
              echo "Advisories: **${total}**"
              echo
              echo '| package | version | advisory |'
              echo '| --- | --- | --- |'
              jq -r '
                .results[]?.packages[]? as $p
                | $p.vulnerabilities[]?
                | "| \($p.package.name) | \($p.package.version) | \(.id) |"
              ' osv-toolchain.json 2>/dev/null | sort -u | head -100
            else
              echo "No report produced (scanner failed or found nothing)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload toolchain report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-toolchain-report
          path: osv-toolchain.json
          if-no-files-found: warn

  # IaC / CI config security — scans GitHub Actions workflows for misconfigurations.
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        continue-on-error: true
        with:
          directory: .
          # The underlying checkov CLI takes a single --framework value here
          # (this action passes it through unsplit) — "secrets" is dropped
          # since Gitleaks, Semgrep's p/secrets ruleset, and GitGuardian
          # already cover secret scanning elsewhere in CI.
          framework: github_actions
          output_format: sarif
          skip_download: 'true'
          soft_fail: 'true'

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          # The pinned checkov version in this action ignores
          # output_file_path and always writes results.sarif to cwd.
          sarif_file: results.sarif

  # DAST — passive baseline scan (headers, cookies, exposed files, auth/session
  # hints) against a production build running locally in the runner. This
  # never touches a real deployment, so it's always scanning "a system we own".
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production bundle
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Start production server
        run: pnpm start &
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds." >&2
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

  # Community-template scan for known misconfigurations/exposed-service
  # patterns, against the same local build (never a real deployment).
  nuclei:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production bundle
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Start production server
        run: pnpm start &
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds." >&2
          exit 1

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        continue-on-error: true
        with:
          version: latest
          args: >-
            -target http://localhost:3000
            -tags cves,misconfig,exposure,default-login
            -severity critical,high,medium
            -silent
