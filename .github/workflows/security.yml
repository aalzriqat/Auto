name: Security

# New security tooling — reports only for now (continue-on-error on every
# job) so findings can be triaged before any of these gate merges. Gitleaks
# (secret scanning) already runs in test.yml's secret-scan job and is not
# duplicated here.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SAST — static analysis of application source for insecure patterns.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Semgrep (CE rulesets)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/nextjs \
            --config=p/react \
            --sarif --output=semgrep.sarif \
            --exclude=node_modules --exclude=.next --exclude=dealer-worker/node_modules \
            --exclude=graphify-out
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # SCA (runtime) — the primary dependency signal: packages that actually ship
  # or run. This is the only SCA job that reaches the Security dashboard, so it
  # is what a merge gate can meaningfully be built on.
  #
  # Scanned explicitly rather than with `--recursive ./`, because a recursive
  # scan also picks up apps/mobile/android/gradle/verification-metadata.xml.
  # That file is Gradle's append-only artifact *checksum ledger*, not a
  # dependency manifest: it records every artifact Gradle ever resolved,
  # including the build classpath (AGP, Kotlin plugin), test-only jars
  # (junit, assertj, mockwebserver) and several simultaneous versions of the
  # same library. It contributed 289 of 301 findings here — 4 Critical and 115
  # High, none of them on a library that ships in the APK — which buried the
  # runtime signal entirely. It is still scanned, by osv-toolchain below.
  #
  # apps/* is a pnpm workspace member, so pnpm-lock.yaml covers the mobile
  # app's JS/React Native dependency graph too. What it does not cover is the
  # Android *native* AAR graph (androidx, com.facebook.react), which only
  # Gradle can resolve — tracked in docs/security/dependency-scanning.md.
  osv-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Explicit lockfile lists go stale silently: a new workspace or worker
      # added later would simply never be scanned, and the job would stay
      # green. Fail loudly instead so the omission is visible.
      - name: Fail if an unlisted runtime lockfile appeared
        run: |
          expected=$(printf '%s\n' \
            "./dealer-worker/package-lock.json" \
            "./pnpm-lock.yaml" | sort)
          actual=$(find . \
            \( -name node_modules -o -name .git -o -name .next \) -prune -o \
            \( -name 'pnpm-lock.yaml' -o -name 'package-lock.json' -o -name 'yarn.lock' \) \
            -print | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Runtime lockfile set changed. Update the osv-runtime scan-args below."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "Runtime lockfile set unchanged."

      - name: Run OSV-Scanner (runtime dependencies)
        id: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-results.sarif
            --format=sarif
            --lockfile=pnpm-lock.yaml
            --lockfile=dealer-worker/package-lock.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          # Pinned explicitly. Without it, upload-sarif derives the analysis
          # category from workflow file + JOB NAME, and the existing analysis on
          # main is keyed `.github/workflows/security.yml:osv-scanner`. Renaming
          # the job to osv-runtime would therefore start a NEW category, leaving
          # the old one orphaned: its 289 gradle + 18 pnpm alerts would never be
          # marked fixed, while the pnpm findings were re-created as new alerts
          # under the new key — more open alerts than before, which is the exact
          # opposite of the point. Pinning the old key updates the analysis in
          # place, so the gradle findings close with a real `fixed` transition.
          category: osv-scanner

  # SCA (build toolchain) — supply-chain visibility for the Gradle build
  # classpath. Deliberately NOT uploaded to code scanning: these are artifacts
  # that run on the build machine, not in the APK or on any server, and at ~289
  # findings they drown the runtime dashboard. Kept as a downloadable report and
  # a job summary so the visibility is not lost, and non-blocking so a build-time
  # advisory never stops a merge.
  #
  # Note this job has no `security-events: write` — it cannot publish alerts
  # even by accident.
  osv-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run OSV-Scanner (Gradle build toolchain)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-toolchain.json
            --format=json
            --lockfile=apps/mobile/android/gradle/verification-metadata.xml

      - name: Summarise toolchain findings
        if: always()
        run: |
          {
            echo "### Gradle build-toolchain advisories"
            echo
            echo "Build-machine artifacts only — these do not ship in the APK."
            echo "Reported for supply-chain visibility; not a merge gate."
            echo
            if [ -s osv-toolchain.json ]; then
              total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-toolchain.json 2>/dev/null || echo "?")
              echo "Advisories: **${total}**"
              echo
              echo '| package | version | advisory |'
              echo '| --- | --- | --- |'
              jq -r '
                .results[]?.packages[]? as $p
                | $p.vulnerabilities[]?
                | "| \($p.package.name) | \($p.package.version) | \(.id) |"
              ' osv-toolchain.json 2>/dev/null | sort -u | head -100
            else
              echo "No report produced (scanner failed or found nothing)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload toolchain report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-toolchain-report
          path: osv-toolchain.json
          if-no-files-found: warn

  # IaC / CI config security — scans GitHub Actions workflows for misconfigurations.
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        continue-on-error: true
        with:
          directory: .
          # The underlying checkov CLI takes a single --framework value here
          # (this action passes it through unsplit) — "secrets" is dropped
          # since Gitleaks, Semgrep's p/secrets ruleset, and GitGuardian
          # already cover secret scanning elsewhere in CI.
          framework: github_actions
          output_format: sarif
          skip_download: 'true'
          soft_fail: 'true'

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          # The pinned checkov version in this action ignores
          # output_file_path and always writes results.sarif to cwd.
          sarif_file: results.sarif

  # DAST — passive baseline scan (headers, cookies, exposed files, auth/session
  # hints) against a production build running locally in the runner. This
  # never touches a real deployment, so it's always scanning "a system we own".
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production bundle
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Start production server
        run: pnpm start &
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds." >&2
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

  # Community-template scan for known misconfigurations/exposed-service
  # patterns, against the same local build (never a real deployment).
  nuclei:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production bundle
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Start production server
        run: pnpm start &
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds." >&2
          exit 1

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        continue-on-error: true
        with:
          version: latest
          args: >-
            -target http://localhost:3000
            -tags cves,misconfig,exposure,default-login
            -severity critical,high,medium
            -silent
