name: Skill Evidence

# pull_request_target on purpose: the judge is main's copy of the script, so a
# PR cannot loosen its own check. This event checks out the base branch by
# default and the step sets no ref, so nothing from the PR is checked out or run;
# the script reads the PR body and file list through the API.
on:
  pull_request_target:
    branches: [ "main" ]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-evidence:
    name: skill-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Check PR skill evidence
        run: node scripts/skillEnforcement/checkPrSkillEvidence.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
