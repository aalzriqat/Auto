name: Skill Evidence

# pull_request_target on purpose: the judge is main's copy of the script, so a
# PR cannot loosen its own check. This event checks out the base branch by
# default and the step sets no ref, so nothing from the PR is checked out or run;
# the script reads the PR body and file list through the API.
on:
  pull_request_target:
    branches: [ "main" ]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# This is a required check, and its result lands on the head the run was
# triggered for. So the group is per PR AND per head: repeated body edits on one
# head cancel each other (the newest run re-reads the body), but a re-run or a
# late event for an older head can never cancel the newest head's check. Only
# pull_request_target triggers this; the run_id fallback is defensive.
concurrency:
  group: skill-evidence-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  skill-evidence:
    name: skill-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Check PR skill evidence
        run: node scripts/skillEnforcement/checkPrSkillEvidence.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
