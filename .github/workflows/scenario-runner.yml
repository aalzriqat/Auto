name: PR scenario runner

# SCRUM-761 R3: runs every active backend-level record of the regression library at
# its bound test and fails when a bound test is missing, not found, skipped or red.
# Backend tests use convex-test, so this job needs no Convex deployment and no secret.
# Advisory: it is not a required check until the owner decides so.
# See docs/adr/2026-11-03-pr-time-scenario-runner.md.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: scenario-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-browser-replays:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The protected jobs have up to 270 minutes of sequential execution.
    # Leave time for verifier setup and a bounded 280-minute receipt wait.
    timeout-minutes: 295
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      manifest: ${{ steps.verify.outputs.manifest }}
      aggregation_available: ${{ steps.available.outputs.aggregation_available }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        fetch-depth: 0

    - name: Find the trusted verifier at the base revision
      id: available
      run: |
        if [ -f scripts/regression/verifyHostedBrowserReplays.mjs ]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        fi
        if [ -f scripts/regression/prScenarioEvidenceCli.mjs ]; then
          echo 'aggregation_available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'aggregation_available=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch the candidate merge as Git objects
      if: steps.available.outputs.available == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
        git fetch --no-tags origin "refs/pull/${PR_NUMBER}/merge:refs/autoflow/scenario-merge"

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      if: steps.available.outputs.available == 'true'
      with:
        version: 11.13.0

    - name: Use Node.js for the receipt verifier
      if: steps.available.outputs.available == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        # The verifier's dependencies must come from the base lockfile on a fresh runner.

    - name: Install trusted verifier dependencies
      if: steps.available.outputs.available == 'true'
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Verify protected browser receipts for this merge
      id: verify
      if: steps.available.outputs.available == 'true'
      run: node scripts/regression/verifyHostedBrowserReplays.mjs
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}

  local-scenarios:
    name: local-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      evidence_digest: ${{ steps.local.outputs.evidence_digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
        # The runner diffs the PR against its base to choose the browser records this PR touches.
        fetch-depth: 0

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium webkit

    # These two configs use synthetic fixtures and need no application server or credentials.
    - name: Run the static visual projects
      run: |
        set -uo pipefail
        status=0
        mkdir -p regression-reports
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/visual.json pnpm run test:visual:deal-cockpit --reporter=list,json || status=1
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-visual.json pnpm exec playwright test -c playwright.opening.visual.config.ts --reporter=list,json || status=1
        exit "$status"
      env:
        CI: true

    - name: Upload static visual diagnostics
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: pr-static-visual-diagnostics
        path: |
          test-results/deal-cockpit-visual/artifacts
          test-results/opening-allocation-visual/artifacts
        retention-days: 14

    - name: Run the library's bound local scenarios
      id: local
      if: ${{ !cancelled() }}
      run: node scripts/regression/prScenarioEvidenceCli.mjs local
      env:
        CI: true
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        NODE_ENV: test
        NODE_OPTIONS: --max-old-space-size=5632

    - name: Publish the selected local verdicts and bindings
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pr-local-scenarios-${{ github.run_id }}-${{ github.run_attempt }}
        path: regression-reports/scenario-evidence-1.json
        if-no-files-found: error
        retention-days: 14

  aggregate-evidence:
    needs: [verify-browser-replays, local-scenarios]
    if: needs.verify-browser-replays.outputs.aggregation_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
    - name: Require both exact-attempt producers
      env:
        LOCAL_RESULT: ${{ needs.local-scenarios.result }}
        BROWSER_RESULT: ${{ needs.verify-browser-replays.result }}
        LOCAL_DIGEST: ${{ needs.local-scenarios.outputs.evidence_digest }}
        ARCHIVE_DIGEST: ${{ needs.local-scenarios.outputs.artifact_digest }}
        ARTIFACT_ID: ${{ needs.local-scenarios.outputs.artifact_id }}
        BROWSER_MANIFEST: ${{ needs.verify-browser-replays.outputs.manifest }}
      run: |
        set -euo pipefail
        [[ "$LOCAL_RESULT" == success && "$BROWSER_RESULT" == success ]]
        [[ "$LOCAL_DIGEST" =~ ^[0-9a-f]{64}$ && "$ARCHIVE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
        [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && -n "$BROWSER_MANIFEST" ]]

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        fetch-depth: 0

    - name: Fetch and retain the exact candidate as Git objects
      env:
        TESTED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
        git fetch --no-tags origin "$TESTED_SHA:refs/autoflow/scenario-merge"

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'

    - name: Verify the exact local evidence and browser receipts
      run: node scripts/regression/prScenarioEvidenceCli.mjs aggregate
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AUTOFLOW_VERIFIED_BROWSER_REPLAYS: ${{ needs.verify-browser-replays.outputs.manifest }}
        LOCAL_EVIDENCE_DIGEST: ${{ needs.local-scenarios.outputs.evidence_digest }}
        LOCAL_ARTIFACT_ID: ${{ needs.local-scenarios.outputs.artifact_id }}
        LOCAL_ARTIFACT_DIGEST: ${{ needs.local-scenarios.outputs.artifact_digest }}

  # The bootstrap job runs the existing full certification, without the token
  # used by either of the jobs that read trusted evidence from GitHub.
  legacy-scenarios:
    needs: [verify-browser-replays, local-scenarios]
    if: needs.verify-browser-replays.outputs.aggregation_available == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'

    - name: Install the existing certification dependencies
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm exec playwright install --with-deps chromium webkit

    - name: Run the existing complete certification on an older base
      env:
        CI: true
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AUTOFLOW_VERIFIED_BROWSER_REPLAYS: ${{ needs.verify-browser-replays.outputs.manifest }}
      run: |
        set -uo pipefail
        status=0
        mkdir -p regression-reports
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/visual.json pnpm run test:visual:deal-cockpit --reporter=list,json || status=1
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-visual.json pnpm exec playwright test -c playwright.opening.visual.config.ts --reporter=list,json || status=1
        NODE_ENV=test NODE_OPTIONS=--max-old-space-size=5632 node scripts/regression/prRunner.mjs --base "$BASE_SHA" \
          --playwright-report visual=regression-reports/visual.json \
          --playwright-report opening-visual=regression-reports/opening-visual.json || status=1
        exit "$status"

  scenarios:
    name: pr-scenario-runner
    needs: [verify-browser-replays, local-scenarios, aggregate-evidence, legacy-scenarios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Require the complete certification for the selected base
      env:
        LOCAL_RESULT: ${{ needs.local-scenarios.result }}
        BROWSER_RESULT: ${{ needs.verify-browser-replays.result }}
        BASE_AGGREGATION: ${{ needs.verify-browser-replays.outputs.aggregation_available }}
        AGGREGATE_RESULT: ${{ needs.aggregate-evidence.result }}
        LEGACY_RESULT: ${{ needs.legacy-scenarios.result }}
        BROWSER_MANIFEST: ${{ needs.verify-browser-replays.outputs.manifest }}
      run: |
        set -euo pipefail
        [[ "$LOCAL_RESULT" == success && "$BROWSER_RESULT" == success && -n "$BROWSER_MANIFEST" ]]
        case "$BASE_AGGREGATION" in
          true) [[ "$AGGREGATE_RESULT" == success && "$LEGACY_RESULT" == skipped ]] ;;
          false) [[ "$LEGACY_RESULT" == success && "$AGGREGATE_RESULT" == skipped ]] ;;
          *) exit 1 ;;
        esac

  aggregation-shadow:
    needs: [verify-browser-replays, local-scenarios]
    if: >-
      needs.verify-browser-replays.outputs.aggregation_available == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'scenario-runner-benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: trusted
        persist-credentials: false
        fetch-depth: 0

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        path: candidate
        persist-credentials: false

    - name: Retain the exact candidate for the shadow run
      env:
        TESTED_SHA: ${{ github.sha }}
        ARTIFACT_ID: ${{ needs.local-scenarios.outputs.artifact_id }}
      run: |
        set -euo pipefail
        [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ && "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
        git -C "$GITHUB_WORKSPACE/trusted" fetch --no-tags origin "$TESTED_SHA:refs/autoflow/scenario-merge"

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        artifact-ids: ${{ needs.local-scenarios.outputs.artifact_id }}
        path: ${{ runner.temp }}/scenario-shadow
        merge-multiple: true

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'

    - name: Exercise the future base aggregator with real workflow evidence
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        LOCAL_EVIDENCE_DIGEST: ${{ needs.local-scenarios.outputs.evidence_digest }}
        AUTOFLOW_VERIFIED_BROWSER_REPLAYS: ${{ needs.verify-browser-replays.outputs.manifest }}
      run: node candidate/scripts/regression/prScenarioEvidenceCli.mjs shadow

  certification-benchmark:
    name: scenario-benchmark-${{ matrix.variant }}
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'scenario-runner-benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [vitest-1, vitest-2, vitest-4, visual, opening-visual, static-serial]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install benchmark dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Measure bound Vitest executions
      if: startsWith(matrix.variant, 'vitest-')
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        VARIANT: ${{ matrix.variant }}
        CI: true
        NODE_ENV: test
        NODE_OPTIONS: --max-old-space-size=5632
      run: node scripts/regression/prScenarioEvidenceCli.mjs benchmark "${VARIANT#vitest-}"

    - name: Install Playwright browsers
      if: endsWith(matrix.variant, 'visual') || matrix.variant == 'static-serial'
      run: pnpm exec playwright install --with-deps chromium webkit

    - name: Measure isolated or serial static executions
      if: endsWith(matrix.variant, 'visual') || matrix.variant == 'static-serial'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        VARIANT: ${{ matrix.variant }}
        CI: true
      run: |
        set -euo pipefail
        mkdir -p regression-reports
        if [[ "$VARIANT" == visual || "$VARIANT" == static-serial ]]; then
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/visual.json pnpm run test:visual:deal-cockpit --reporter=list,json
        fi
        if [[ "$VARIANT" == opening-visual || "$VARIANT" == static-serial ]]; then
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-visual.json pnpm exec playwright test -c playwright.opening.visual.config.ts --reporter=list,json
        fi
        if [[ "$VARIANT" == visual || "$VARIANT" == static-serial ]]; then
          node scripts/regression/prScenarioEvidenceCli.mjs static-census visual
        fi
        if [[ "$VARIANT" == opening-visual || "$VARIANT" == static-serial ]]; then
          node scripts/regression/prScenarioEvidenceCli.mjs static-census opening-visual
        fi
