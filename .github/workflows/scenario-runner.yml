name: PR scenario runner

# SCRUM-761 R3: runs every active backend-level record of the regression library at
# its bound test and fails when a bound test is missing, not found, skipped or red.
# Backend tests use convex-test, so this job needs no Convex deployment and no secret.
# Advisory: it is not a required check until the owner decides so.
# See docs/adr/2026-11-03-pr-time-scenario-runner.md.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: scenario-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: pr-scenario-runner
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
        # The runner diffs the PR against its base to choose the browser records this PR touches.
        fetch-depth: 0

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium webkit

    # These two configs use synthetic fixtures and need no application server or credentials.
    - name: Run the static visual projects
      run: |
        set -uo pipefail
        status=0
        mkdir -p regression-reports
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/visual.json pnpm run test:visual:deal-cockpit --reporter=list,json || status=1
        PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-visual.json pnpm exec playwright test -c playwright.opening.visual.config.ts --reporter=list,json || status=1
        exit "$status"
      env:
        CI: true

    - name: Upload static visual diagnostics
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: pr-static-visual-diagnostics
        path: |
          test-results/deal-cockpit-visual/artifacts
          test-results/opening-allocation-visual/artifacts
        retention-days: 14

    - name: Run the library's bound scenarios
      if: ${{ !cancelled() }}
      run: >-
        node scripts/regression/prRunner.mjs --base "$BASE_SHA"
        --playwright-report regression-reports/visual.json
        --playwright-report regression-reports/opening-visual.json
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        NODE_ENV: test
        NODE_OPTIONS: --max-old-space-size=5632
