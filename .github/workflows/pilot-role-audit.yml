name: Pilot Role Audit (roles, EN-AR, phone-desktop)

# SCRUM-616: main-only, real product roles on independent disposable backends.
#
# SCRUM-892 (owner ruling "Local + cloud at release", 2026-11-03): the nightly
# schedule and an ordinary dispatch run each role on its OWN local self-hosted
# Convex container (scripts/localConvexBackend.mjs, the mechanism of
# browser-attack-swarm.yml), all six roles in parallel. A release dispatches with
# backend=cloud, which keeps the earlier behaviour exactly: one named Convex
# preview per role (--preview-create), one role at a time. That cloud run at the
# release tip is the release evidence.
#
# max-parallel is 1 in cloud mode on purpose: a preview is Convex cloud I/O that
# counts against the team quota (SCRUM-807/892), and six at once also multiply
# the live previews the project may hold. Local mode costs the quota nothing.
#
# The job `if` below stays main-only, so a branch dispatch cannot run it and the
# wall time of a branch cannot be measured before merge.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: "local (default): per-job self-hosted Convex, six roles in parallel. cloud: one Convex preview per role, serial; use for the release run."
        type: choice
        options:
          - local
          - cloud
        default: local

permissions:
  contents: read

concurrency:
  # The backend is part of the group so a nightly or local dispatch can never
  # cancel a cloud release run in flight (or the reverse).
  group: pilot-role-audit-${{ github.ref }}-${{ inputs.backend || 'local' }}
  cancel-in-progress: true

jobs:
  roles:
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.backend == 'cloud' && 1 || 6 }}
      matrix:
        role: [OWNER, MANAGER, SALES, RECEPTION, ACCOUNTANT, SENIOR_ACCOUNTANT]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Setup and all route cells use one browser worker; every role has its own preview.
    timeout-minutes: 120
    env:
      # A schedule has no inputs, so it resolves to local.
      AUDIT_BACKEND: ${{ inputs.backend || 'local' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # A distinct ref string so this preview never collides with the one
      # trusted-main-e2e creates for refs/heads/main.
      - name: Name the disposable scenarios preview
        if: env.AUDIT_BACKEND == 'cloud'
        run: |
          set -euo pipefail
          NAME="$(node scripts/e2ePreviewBootstrap.mjs --print-name "${GITHUB_REF}-role-${AUDIT_ROLE}" "")"
          NAME="${NAME//_/-}"
          echo "CONVEX_PREVIEW_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Preview deployment name: $NAME"

        env:
          AUDIT_ROLE: ${{ matrix.role }}

      - name: Recreate Convex E2E backend
        if: env.AUDIT_BACKEND == 'cloud'
        run: |
          set -euo pipefail
          retry_convex() {
            local attempt delay
            delay=2
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              if [ "$attempt" = "5" ]; then return 1; fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry_convex pnpm exec convex deploy \
            --typecheck enable \
            --preview-create "$CONVEX_PREVIEW_NAME" \
            --preview-run e2eBootstrap:markPreviewDeployment \
            --cmd 'echo "NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"; echo "CONVEX_PREVIEW_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Pin the disposable preview for cleanup
        if: always() && env.CONVEX_PREVIEW_URL != ''
        run: node scripts/previewDeploymentLifecycle.mjs pin --strict
        env:
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Refuse an unpinned role audit preview
        if: env.AUDIT_BACKEND == 'cloud'
        run: |
          if [ -z "${CONVEX_PREVIEW_CREATED_AT:-}" ]; then
            echo "Disposable role preview has no pinned cleanup identity." >&2
            exit 1
          fi

      - name: Seed the QA dealership
        if: env.AUDIT_BACKEND == 'cloud'
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Set exact product role templates
        if: env.AUDIT_BACKEND == 'cloud'
        run: |
          set -euo pipefail
          node scripts/e2ePreviewBootstrap.mjs --set-role approver MANAGER
          node scripts/e2ePreviewBootstrap.mjs --set-role approver "$AUDIT_ROLE"
        env:
          AUDIT_ROLE: ${{ matrix.role }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      # ---- Local mode (SCRUM-892): no Convex cloud credential exists in these steps.
      # The backend is a disposable self-hosted Convex container on this runner:
      # pinned by digest, published on 127.0.0.1 only, per-run secret, removed by
      # the always() step at the end. Trusted main code only, so there is nothing
      # to stage; `mark` and `verify` are the same tripwire the swarm uses.
      - name: Start the local Convex backend
        if: env.AUDIT_BACKEND == 'local'
        run: node scripts/localConvexBackend.mjs start

      # Before the deploy: convex/auth.config.ts is evaluated at deploy time.
      - name: Set and verify the local backend environment allowlist
        if: env.AUDIT_BACKEND == 'local'
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Deploy main to the local Convex backend
        if: env.AUDIT_BACKEND == 'local'
        run: pnpm exec convex deploy --typecheck enable --yes
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}

      - name: Mint the disposable-preview marker and record the tripwire baseline
        if: env.AUDIT_BACKEND == 'local'
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Seed the QA dealership on the local backend
        if: env.AUDIT_BACKEND == 'local'
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Set exact product role templates on the local backend
        if: env.AUDIT_BACKEND == 'local'
        run: |
          set -euo pipefail
          node scripts/e2ePreviewBootstrap.mjs --set-role approver MANAGER
          node scripts/e2ePreviewBootstrap.mjs --set-role approver "$AUDIT_ROLE"
        env:
          AUDIT_ROLE: ${{ matrix.role }}
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Run the attested role, locale and viewport matrix
        run: node scripts/pilotRoleAuditEvidence.mjs
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          HUNT_AUDIT_ROLE: ${{ matrix.role }}
          # Cloud mode only. Empty in local mode, where the backend is addressed by
          # CONVEX_SELF_HOSTED_* (already in this job's env) and a deploy key
          # beside them is refused by scripts/e2ePreviewBootstrap.mjs.
          CONVEX_PREVIEW_NAME: ${{ env.AUDIT_BACKEND == 'cloud' && env.CONVEX_PREVIEW_NAME || '' }}
          CONVEX_DEPLOY_KEY: ${{ env.AUDIT_BACKEND == 'cloud' && secrets.CONVEX_PREVIEW_DEPLOY_KEY || '' }}
          # The trusted frontend reaches the runner-local backend only through
          # lib/security/contentSecurityPolicy.ts's explicit CI switch; unset in cloud mode.
          AUTOFLOW_LOCAL_CONVEX_CI: ${{ env.AUDIT_BACKEND == 'local' && '1' || '' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
          CI: true

      # Trusted tripwire (PR #757 round 5): fails the job unless the backend still
      # equals what `mark` recorded. always(): a red matrix still gets its check.
      - name: Verify the local backend was not changed during the run
        if: always() && env.AUDIT_BACKEND == 'local' && env.AUTOFLOW_LOCAL_CONVEX_CODE_FINGERPRINT != ''
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Stop the local Convex backend
        if: always()
        run: node scripts/localConvexBackend.mjs stop

      - name: Upload encrypted role audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pilot-role-audit-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/pilot-role-audit-public/role-evidence.tar.gpg
            ${{ runner.temp }}/pilot-role-audit-public/results.json
          if-no-files-found: error
          retention-days: 14

      - name: Delete the disposable preview
        if: always() && env.CONVEX_PREVIEW_CREATED_AT != ''
        run: node scripts/previewDeploymentLifecycle.mjs delete
        env:
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
