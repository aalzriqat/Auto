name: Pilot Role Audit (roles, EN-AR, phone-desktop)

# SCRUM-616: main-only, real product roles on independent disposable backends.
#
# SCRUM-892 (owner ruling 2026-11-03, "Keep the role audit fully local no need
# for cloud on release"): every run, schedule or dispatch, gives each role its OWN
# local self-hosted Convex container (scripts/localConvexBackend.mjs, the mechanism
# of browser-attack-swarm.yml) and runs all six roles in parallel. The local result
# is the release evidence. No Convex cloud preview or credential exists in this file.
#
# The job `if` below stays main-only, so a branch dispatch cannot run it and the
# wall time of a branch cannot be measured before merge.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-role-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roles:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        role: [OWNER, MANAGER, SALES, RECEPTION, ACCOUNTANT, SENIOR_ACCOUNTANT]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Each matrix job has its own runner, so each can bind the fixed port 127.0.0.1:3210.
    # Do not merge roles onto one runner.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the local Convex backend
        run: node scripts/localConvexBackend.mjs start

      # Before the deploy: convex/auth.config.ts is evaluated at deploy time.
      - name: Set and verify the local backend environment allowlist
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Deploy main to the local Convex backend
        run: pnpm exec convex deploy --typecheck enable --yes
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}

      - name: Mint the disposable-preview marker and record the tripwire baseline
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Seed the QA dealership on the local backend
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Set exact product role templates on the local backend
        run: |
          set -euo pipefail
          node scripts/e2ePreviewBootstrap.mjs --set-role approver MANAGER
          node scripts/e2ePreviewBootstrap.mjs --set-role approver "$AUDIT_ROLE"
        env:
          AUDIT_ROLE: ${{ matrix.role }}
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Run the attested role, locale and viewport matrix
        run: node scripts/pilotRoleAuditEvidence.mjs
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          HUNT_AUDIT_ROLE: ${{ matrix.role }}
          # The backend is addressed by CONVEX_SELF_HOSTED_* (in this job's env from
          # the start step); no preview name or deploy key exists here.
          # The trusted frontend reaches the runner-local backend only through
          # lib/security/contentSecurityPolicy.ts's explicit CI switch.
          AUTOFLOW_LOCAL_CONVEX_CI: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
          CI: true

      # Trusted tripwire (PR #757 round 5): fails the job unless the backend still
      # equals what `mark` recorded. Plain always(): verifyBackend refuses a missing
      # baseline, so a cleared fingerprint turns the job red instead of skipping this step.
      - name: Verify the local backend was not changed during the run
        if: always()
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Stop the local Convex backend
        if: always()
        run: node scripts/localConvexBackend.mjs stop

      - name: Upload encrypted role audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pilot-role-audit-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/pilot-role-audit-public/role-evidence.tar.gpg
            ${{ runner.temp }}/pilot-role-audit-public/results.json
          if-no-files-found: error
          retention-days: 14
