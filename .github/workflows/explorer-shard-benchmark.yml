name: Explorer shard benchmark

# Timing diagnostic for the existing authenticated pilot UI journeys.
# This workflow has no certification or deployment authority.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of isolated Explorer shards
        required: true
        type: choice
        options: ["4", "6"]
      revision:
        description: Exact main commit to measure in both benchmark variants
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: explorer-shard-benchmark
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.admit.outputs.matrix }}
    steps:
      - name: Bind the benchmark to the exact main dispatch
        id: admit
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPLORER_SHARD_COUNT: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "aalzriqat/Auto" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/explorer-shard-benchmark.yml@refs/heads/main" ]]
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ && "$EXPECTED_REVISION" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          case "$EXPLORER_SHARD_COUNT" in
            4) echo 'matrix=[1,2,3,4]' >> "$GITHUB_OUTPUT" ;;
            6) echo 'matrix=[1,2,3,4,5,6]' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  explorer-timing:
    name: Explorer timing shard ${{ matrix.shard }}
    needs: admit
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.admit.outputs.matrix) }}
    env:
      EXPLORER_SHARD_COUNT: ${{ inputs.shards }}
      EXPLORER_SHARD_INDEX: ${{ matrix.shard }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Record the start of shard setup
        run: echo "EXPLORER_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the pinned checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: pnpm

      - name: Install pinned dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Start a disposable local Convex backend
        run: node scripts/localConvexBackend.mjs start

      - name: Verify the local backend environment allowlist
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy the pinned revision to the local backend
        run: |
          set -euo pipefail
          [[ "$CONVEX_SELF_HOSTED_URL" == "http://127.0.0.1:3210" && -n "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]]
          [[ -z "${CONVEX_DEPLOY_KEY:-}" && -z "${CONVEX_PREVIEW_DEPLOY_KEY:-}" && ! -e .env.local ]]
          pnpm exec convex deploy --typecheck enable --yes

      - name: Mark the disposable backend and record its baseline
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Seed the shard's QA dealership
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Time only this shard's authenticated Explorer journeys
        env:
          AUTOFLOW_LOCAL_CONVEX_CI: "1"
          AUTOFLOW_TRUSTED_EXPLORER: "1"
          CI: "true"
          CROSS_SCREEN_ORACLE: "1"
          JEV_EXPLORER_SEED: "762"
          JEV_EXPLORER_STEPS: "40"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$E2E_LOGIN_USER" && -n "$E2E_LOGIN_PASSWORD" && -n "$E2E_APPROVER_USER" && -n "$E2E_APPROVER_PASSWORD" ]]
          [[ -z "${TYPESAFE_API_KEY:-}" && "$NEXT_PUBLIC_CONVEX_URL" == "http://127.0.0.1:3210" ]]
          filter="$(node scripts/explorerShardBenchmark.mjs filter)"
          [[ -n "$filter" ]]
          args=(test -c playwright.scenarios.config.ts --project=chromium --workers=1 --retries=0 --reporter=json
            --grep "$filter" playwright/scenarios/jev-explorer.spec.ts)
          if ! PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/explorer-discovery.json" pnpm exec playwright "${args[@]}" --list > "$RUNNER_TEMP/explorer-discovery.log" 2>&1; then
            echo "::error::Explorer benchmark discovery failed."
            exit 1
          fi
          echo "EXPLORER_PLAYWRIGHT_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          if ! PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/explorer-results.json" pnpm exec playwright "${args[@]}" > "$RUNNER_TEMP/explorer-results.log" 2>&1; then
            echo "::error::An authenticated benchmark journey failed."
            exit 1
          fi
          echo "EXPLORER_PLAYWRIGHT_ENDED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Verify the backend baseline
        if: always()
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Stop the disposable backend
        if: always()
        run: node scripts/localConvexBackend.mjs stop

      - name: Write only verified timing and binding evidence
        run: |
          set -euo pipefail
          node scripts/explorerShardBenchmark.mjs record "$RUNNER_TEMP/explorer-discovery.json" "$RUNNER_TEMP/explorer-results.json" > "$RUNNER_TEMP/shard.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explorer-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard.json
          if-no-files-found: error
          retention-days: 14

  benchmark-summary:
    needs: [admit, explorer-timing]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPLORER_SHARD_COUNT: ${{ inputs.shards }}
    steps:
      - name: Require all shard jobs to succeed
        env:
          SHARD_JOBS_RESULT: ${{ needs.explorer-timing.result }}
        run: test "$SHARD_JOBS_RESULT" = "success"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: explorer-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explorer-shards

      - name: Summarize the exact same-attempt shard evidence
        run: |
          set -euo pipefail
          node scripts/explorerShardBenchmark.mjs summary "$RUNNER_TEMP/explorer-shards" > "$RUNNER_TEMP/explorer-benchmark-summary.json"
          {
            echo '## Authenticated Explorer benchmark'
            echo 'The shard window covers setup, Playwright, and cleanup. Playwright includes the app build and login.'
            echo '```json'
            cat "$RUNNER_TEMP/explorer-benchmark-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explorer-benchmark-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/explorer-benchmark-summary.json
          if-no-files-found: error
          retention-days: 14
