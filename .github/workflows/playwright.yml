name: E2E Tests (Playwright)

# Pull-request code is untrusted input. This workflow deliberately has zero
# reusable secret references: it performs static browser validation and emits
# only an identity descriptor. The default-branch workflow_run owns all
# privileged preview provisioning and authenticated E2E execution.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Direct PR browser validation is single-flight per PR/ref. Keep this domain
  # separate from the privileged workflow_run swarm so a late swarm start can
  # never cancel the newer direct E2E run that should supersede it.
  group: direct-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Deal cockpit visual gate (static, no credentials)
        run: |
          set -euo pipefail
          pnpm run test:visual:deal-cockpit
          SHOTS="$(find test-results/deal-cockpit-visual -mindepth 2 -maxdepth 2 -name 'deal-cockpit-*.png' | wc -l)"
          echo "visual gate screenshots: $SHOTS"
          if [ "$SHOTS" -ne 16 ]; then
            echo "expected 16 screenshots (2 locales x 2 themes x 2 viewports x top/bottom), found $SHOTS" >&2
            exit 1
          fi
        env:
          CI: true

      - name: Upload deal cockpit visual screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deal-cockpit-visual
          path: test-results/deal-cockpit-visual/
          retention-days: 14

      - name: Name the preview deployment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          NAME="$(node scripts/e2ePreviewBootstrap.mjs --print-name "$GITHUB_REF" "$PR_NUMBER")"
          echo "CONVEX_PREVIEW_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Preview identity: $NAME"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Write sanitized preview descriptor
        if: github.event_name == 'pull_request'
        run: pnpm e2e:preview-descriptor
        env:
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload sanitized preview descriptor
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-preview-descriptor
          path: artifacts/e2e-preview-descriptor.json
          if-no-files-found: error
          retention-days: 14
