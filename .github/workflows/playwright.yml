name: E2E Tests (Playwright)

# Pull-request code is untrusted input. This workflow deliberately has zero
# reusable secret references: it performs static browser validation and emits
# only an identity descriptor. The default-branch workflow_run owns all
# privileged preview provisioning and authenticated E2E execution.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Deal cockpit visual gate (static, no credentials)
        run: |
          set -euo pipefail
          pnpm run test:visual:deal-cockpit
          # Each class of frame is counted exactly, so a matrix that silently
          # shrank cannot hide behind another class that grew.
          count() { find test-results/deal-cockpit-visual -mindepth 2 -maxdepth 2 -name "$1" | wc -l; }
          # '*-top.png' also matches the '*-expanded-top.png' frames, so those
          # are counted as their own class and subtracted from the base count.
          EXPANDED="$(count 'deal-cockpit-*-expanded-top.png')"
          BASE="$(( $(count 'deal-cockpit-*-top.png') - EXPANDED + $(count 'deal-cockpit-*-bottom.png') ))"
          NEXT_STEP="$(count 'deal-cockpit-*-next-step.png')"
          PANEL="$(count 'deal-cockpit-*-panel.png')"
          # SCRUM-417 UX4 frames end in the variant name (-ux4-<variant>.png), so no
          # other class's glob (-top, -bottom, -next-step, -panel) can match them.
          UX4="$(count 'deal-cockpit-*-ux4-*.png')"
          # SCRUM-435 forward-step frames end in -forward-<variant>.png, likewise unmatched by the other globs.
          FORWARD="$(count 'deal-cockpit-*-forward-*.png')"
          echo "visual gate screenshots: base $BASE, expanded record $EXPANDED, withheld-close next-step $NEXT_STEP, panel $PANEL, ux4 $UX4, forward $FORWARD"
          if [ "$BASE" -ne 16 ]; then
            echo "expected 16 base screenshots (2 locales x 2 themes x 2 viewports x top/bottom), found $BASE" >&2
            exit 1
          fi
          if [ "$EXPANDED" -ne 8 ]; then
            echo "expected 8 expanded Deal details screenshots (2 locales x 2 themes x 2 viewports, SCRUM-417 UX3), found $EXPANDED" >&2
            exit 1
          fi
          if [ "$NEXT_STEP" -ne 16 ] || [ "$PANEL" -ne 8 ]; then
            echo "expected 16 withheld-close next-step (2 variants x 8) and 8 panel screenshots (SCRUM-414), found $NEXT_STEP and $PANEL" >&2
            exit 1
          fi
          if [ "$FORWARD" -ne 16 ]; then
            echo "expected 16 forward-step screenshots (2 variants x 2 locales x 2 themes x 2 viewports, SCRUM-435), found $FORWARD" >&2
            exit 1
          fi
          # 9 frames x 8 (2 locales x 2 themes x 2 viewports): the 3 SCRUM-417 UX4
          # variants, plus SCRUM-446's na-rail (+rail frame), na-view (+rail frame)
          # and na-finished (+summary frame).
          if [ "$UX4" -ne 72 ]; then
            echo "expected 72 UX4 checklist / step-view screenshots (9 frames x 2 locales x 2 themes x 2 viewports, SCRUM-417 UX4 + SCRUM-446), found $UX4" >&2
            exit 1
          fi
        env:
          CI: true

      - name: Upload deal cockpit visual screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deal-cockpit-visual
          path: test-results/deal-cockpit-visual/
          retention-days: 14

      - name: Name the preview deployment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          NAME="$(node scripts/e2ePreviewBootstrap.mjs --print-name "$GITHUB_REF" "$PR_NUMBER")"
          echo "CONVEX_PREVIEW_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Preview identity: $NAME"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Write sanitized preview descriptor
        if: github.event_name == 'pull_request'
        run: pnpm e2e:preview-descriptor
        env:
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload sanitized preview descriptor
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-preview-descriptor
          path: artifacts/e2e-preview-descriptor.json
          if-no-files-found: error
          retention-days: 14
