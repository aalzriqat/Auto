name: E2E Tests (Playwright)

# Pull-request code is untrusted input. This workflow deliberately has zero
# reusable secret references: it performs static browser validation and emits
# only an identity descriptor. The default-branch workflow_run owns all
# privileged preview provisioning and authenticated E2E execution.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SCRUM-861: avoid the measured per-run apt download stall.
    # Image fonts/shared memory change; old pixel hashes do not carry, and
    # this does not establish the screenshot-protocol failure cause.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001 --init --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify preinstalled Playwright browsers
        run: |
          test "$(id -u)" -eq 1001
          test -w "$HOME"
          test -w "$GITHUB_WORKSPACE"
          test "$(node --version)" = "v22.21.1"
          node scripts/playwrightImagePreflight.mjs

      - name: Record anonymous browser runner resources
        run: |
          uname -srm
          free -m
          df -h /dev/shm /tmp
          ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,16p'

      - name: Deal cockpit visual gate (static, no credentials)
        run: |
          set -euo pipefail
          pnpm run test:visual:deal-cockpit
          # The frame census is shared with trusted-main-e2e.yml (SCRUM-489).
          node scripts/assertDealCockpitVisualFrames.mjs test-results/deal-cockpit-visual
          node scripts/assertRoleAccessVisualFrames.mjs test-results/deal-cockpit-visual
        env:
          CI: true

      - name: Upload deal cockpit visual screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deal-cockpit-visual
          path: test-results/deal-cockpit-visual/
          retention-days: 14

      - name: Name the preview deployment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          NAME="$(node scripts/e2ePreviewBootstrap.mjs --print-name "$GITHUB_REF" "$PR_NUMBER")"
          echo "CONVEX_PREVIEW_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Preview identity: $NAME"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Write sanitized preview descriptor
        if: github.event_name == 'pull_request'
        run: pnpm e2e:preview-descriptor
        env:
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload sanitized preview descriptor
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-preview-descriptor
          path: artifacts/e2e-preview-descriptor.json
          if-no-files-found: error
          retention-days: 14
