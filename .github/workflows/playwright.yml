name: E2E Tests (Playwright)

# The repo's only E2E suite. Signs in with a dedicated Clerk test-mode
# account (the E2E_LOGIN_* secrets), so these runs never send a real email.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:


# Least-privilege default for every job here: this workflow only reads the
# repository. Without an explicit block, jobs inherit the repository-wide
# default token scope, which is broader than anything below needs.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ONE definition, shared by the deploy and the stamping step below.
      # If those two could compute different names they would target
      # different deployments -- deploy one preview, stamp another -- and
      # the contention suite would read its safety facts off a backend that
      # is not the one answering the races. Defining it once makes that
      # impossible by construction.
      #
      # `head_ref || ref_name` keeps the pull_request path byte-identical
      # to the name the CLI already derives there, and gives
      # workflow_dispatch and push the same named preview instead of an
      # anonymous one.
      CONVEX_PREVIEW_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare Convex E2E backend
        # The four backend env vars this step needs -- CLERK_JWT_ISSUER_DOMAIN,
        # CLERK_DEV_JWT_ISSUER_DOMAIN, TURNSTILE_SECRET_KEY and
        # NEXT_PUBLIC_APP_URL -- come from the Convex project's DEFAULT
        # ENVIRONMENT VARIABLES (Project Settings -> Default Environment
        # Variables, scoped to Preview). They have to be seeded at CREATION:
        # a preview starts with no variables at all, so `auth.config.ts`'s
        # own validation fails the very first deploy otherwise.
        #
        # `--preview-name` is load-bearing, and its absence is what SCRUM-95
        # still was. Without it the CLI derives the name from GITHUB_HEAD_REF
        # (cli/lib/envvars.js), which GitHub sets ONLY for `pull_request`
        # events; on `workflow_dispatch` and `push` it is the EMPTY STRING,
        # and `??` does not fall through on an empty string. The deployment
        # was then claimed with an empty identifier -- it appears in the
        # dashboard as `preview/` -- so `convex env set` had no deployment to
        # resolve and returned "Not authorized".
        #
        # That is why run 32986375959 (dispatch) failed five times on
        # CLERK_JWT_ISSUER_DOMAIN while run 32785077157 (pull_request)
        # deployed the same code fine and got as far as the browser tests:
        # the PR path was named by accident, and nothing else ever was.
        #
        # The retry wrapper stays. Convex refuses requests transiently under
        # load with "Try again later", and treating that as fatal is exactly
        # the defect SCRUM-142 records against the release rollout. It cannot
        # help with a configuration error, though -- a missing variable fails
        # identically on all five attempts, as that run shows.
        run: |
          set -euo pipefail

          # An empty name is the defect itself. Fail here rather than claim
          # an anonymous preview that nothing downstream can resolve.
          if [ -z "${CONVEX_PREVIEW_NAME:-}" ]; then
            echo "CONVEX_PREVIEW_NAME is empty; refusing to claim an anonymous preview deployment." >&2
            exit 1
          fi

          retry_convex() {
            local attempt delay
            delay=2
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" = "5" ]; then
                return 1
              fi
              echo "Convex command failed on attempt $attempt/5; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          retry_convex pnpm exec convex deploy             --preview-name "$CONVEX_PREVIEW_NAME"             --typecheck enable             --cmd 'echo "NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"'             --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Mark the preview backend disposable and stamp the commit
        # SCRUM-195. The commitment contention suite deliberately tries to
        # double-book inventory, so it refuses to run unless the BACKEND says it
        # is a throwaway. That declaration lives on the deployment rather than
        # in the workflow, because a workflow variable proves what CI intended
        # and not what actually answered the races.
        #
        # `DEPLOYMENT_GIT_SHA` is the other half: without it a green run cannot
        # be attributed to a candidate commit, and a race that passed against a
        # stale preview would be reported under the SHA that was merely checked
        # out. The suite treats a missing value as absent evidence, not a pass.
        #
        # No `|| true`. If these do not take, the contention gate cannot mean
        # anything, and a step that swallows its own failure is how an
        # unexecuted gate comes to read as a passing one.
        run: |
          set -euo pipefail
          pnpm exec convex env set --preview-name "$CONVEX_PREVIEW_NAME" AUTOFLOW_DISPOSABLE_DEPLOYMENT true
          pnpm exec convex env set --preview-name "$CONVEX_PREVIEW_NAME" DEPLOYMENT_GIT_SHA "$GITHUB_SHA"

          # The approver seat is provisioned through the product's own Add Team
          # Member path (`memberships.createAccount`), and that action calls
          # Clerk from the BACKEND -- so the key has to be on the Convex
          # deployment. Having it in this workflow's environment is not the same
          # thing, which is why auth.setup.ts names that distinction explicitly
          # when it fails.
          #
          # `--preview-name` is what keeps this narrow: a preview deploy key
          # cannot reach production at all, and the name is the same one the
          # step above just marked disposable. Never echoed -- `convex env set`
          # does not print the value, and GitHub masks the secret regardless.
          pnpm exec convex env set --preview-name "$CONVEX_PREVIEW_NAME" CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Run Playwright tests
        # playwright.config.ts's webServer builds and starts the production
        # server itself and waits for it to be ready, so no separate
        # build/start/wait-for-server steps are needed here.
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          # The SECOND identity. AutoFlow refuses to let one person both create
          # and approve a deal, so the financed workflow cannot be driven end to
          # end by one login — without these the two-identity spec skips, and a
          # skip reads exactly like a pass.
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
          # SCRUM-195: the contention suite compares this against the SHA the
          # BACKEND reports, so a race can only be attributed to the commit that
          # actually answered it.
          GITHUB_SHA: ${{ github.sha }}
          CI: true

      - name: Prove the commitment races actually ran
        # SCRUM-195. Every other check here fails loudly; this one exists
        # because the contention gate can fail QUIETLY. The races live in the
        # `chromium` project, which `dependencies: ["setup"]` -- so if
        # auth.setup.ts fails or skips, Playwright skips all of them and the
        # run can still be summarised as though the concurrency question was
        # answered. It was not asked.
        #
        # Absence of evidence is not evidence. A race that did not execute is
        # UNAVAILABLE, never a pass, so this converts "skipped" and "not
        # collected" into a hard failure -- the only direction that cannot
        # overstate what was proved.
        if: always()
        run: |
          set -euo pipefail
          node .github/scripts/assert-contention-ran.mjs

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
