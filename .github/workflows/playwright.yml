name: E2E Tests (Playwright)

# The repo's only E2E suite. Signs in with a dedicated Clerk test-mode
# account (the E2E_LOGIN_* secrets), so these runs never send a real email.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:


# Least-privilege default for every job here: this workflow only reads the
# repository. Without an explicit block, jobs inherit the repository-wide
# default token scope, which is broader than anything below needs.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare Convex E2E backend
        # The four backend env vars this step used to write with `convex env
        # set` now come from the Convex project's DEFAULT ENVIRONMENT VARIABLES
        # (Project Settings -> Default Environment Variables, scoped to
        # Preview): CLERK_JWT_ISSUER_DOMAIN, CLERK_DEV_JWT_ISSUER_DOMAIN,
        # TURNSTILE_SECRET_KEY and NEXT_PUBLIC_APP_URL.
        #
        # They have to be seeded at CREATION, not written afterwards. A preview
        # deployment starts with no env vars at all, so `auth.config.ts`'s own
        # validation failed the very first deploy -- which is why this step used
        # to deploy, swallow that failure with `|| true`, set the four vars, and
        # deploy a second time.
        #
        # That never worked. `convex env set` returned "Not authorized" on every
        # attempt, so the second deploy never ran and the preview deployment sat
        # at "Never deployed" while the job failed before a single browser test
        # started. The key was not the problem -- "View allowed actions" shows it
        # holds `deployment:env:write` -- it is that the preview was created
        # without a name (it appears in the dashboard as `preview/`), so
        # `env set` had no deployment to resolve to.
        #
        # Seeding defaults removes the two-pass dance entirely: the first deploy
        # already has what it needs. SCRUM-95.
        #
        # The retry wrapper stays. Convex refuses requests transiently under
        # load with "Try again later", and treating that as fatal is exactly the
        # defect SCRUM-142 records against the release rollout.
        run: |
          set -euo pipefail

          retry_convex() {
            local attempt delay
            delay=2
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" = "5" ]; then
                return 1
              fi
              echo "Convex command failed on attempt $attempt/5; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          retry_convex pnpm exec convex deploy             --typecheck enable             --cmd 'echo "NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"'             --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Run Playwright tests
        # playwright.config.ts's webServer builds and starts the production
        # server itself and waits for it to be ready, so no separate
        # build/start/wait-for-server steps are needed here.
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          # The SECOND identity. AutoFlow refuses to let one person both create
          # and approve a deal, so the financed workflow cannot be driven end to
          # end by one login — without these the two-identity spec skips, and a
          # skip reads exactly like a pass.
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
