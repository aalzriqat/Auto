name: Trusted Accounting Cloud Rehearsal

on:
  workflow_run:
    workflows: ["Accounting Cloud Rehearsal"]
    types: [completed]
  # repository_dispatch loads this workflow from the default branch. A
  # branch-selectable workflow_dispatch would let candidate YAML reach the
  # rehearsal's Clerk secrets and its exact-SHA release verdict.
  repository_dispatch:
    types: [autoflow-release-accounting-rehearsal]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'trusted-accounting-release' || format('trusted-accounting-pr-{0}', github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id) }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  dispatch_preflight:
    name: trusted-accounting-release-request
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'autoflow-release-accounting-rehearsal' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      exact_sha: ${{ steps.exact.outputs.exact_sha }}
    steps:
      - name: Compare release request to event commit exactly
        id: exact
        env:
          RELEASE_INPUT_SHA: ${{ github.event.client_payload.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [ "$RELEASE_INPUT_SHA" = "$EVENT_SHA" ]; then
            echo "exact_sha=true" >> "$GITHUB_OUTPUT"
          else
            echo "exact_sha=false" >> "$GITHUB_OUTPUT"
          fi

  rehearsal:
    name: trusted-accounting-rehearsal
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'autoflow-release-accounting-rehearsal' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      tested_sha: ${{ steps.provenance.outputs.tested_sha }}
      base_sha: ${{ steps.provenance.outputs.base_sha }}
      run_rehearsal: ${{ steps.backend_inputs.outputs.run_rehearsal }}

    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      RELEASE_INPUT_SHA: ${{ github.event.client_payload.commit_sha }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EVENT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: true

      - name: Verify exact PR head and merge provenance
        id: provenance
        working-directory: trusted
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if ! [[ "$RELEASE_INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release rehearsal requires an exact 40-character SHA." >&2
              exit 1
            fi
            git fetch --no-tags origin "+refs/heads/main:refs/autoflow/accounting-main"
            MAIN_SHA="$(git rev-parse refs/autoflow/accounting-main)"
            if [ "$MAIN_SHA" != "$RELEASE_INPUT_SHA" ] ||
               [ "$WORKFLOW_SHA" != "$RELEASE_INPUT_SHA" ] ||
               [ "$EVENT_SHA" != "$RELEASE_INPUT_SHA" ]; then
              echo "Release SHA, live main, trusted workflow and event commit differ." >&2
              exit 1
            fi
            echo "TESTED_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
            echo "tested_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "preview_ref=refs/heads/main" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "workflow_run did not provide a valid PR number" >&2
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "workflow_run did not provide an exact head SHA" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/autoflow/accounting-pr-head" \
            "refs/pull/${PR_NUMBER}/merge:refs/autoflow/accounting-pr-merge"

          FETCHED_HEAD="$(git rev-parse refs/autoflow/accounting-pr-head)"
          FETCHED_MERGE="$(git rev-parse refs/autoflow/accounting-pr-merge)"
          if [ "$FETCHED_HEAD" != "$HEAD_SHA" ]; then
            echo "Fetched PR head does not match workflow_run head SHA" >&2
            exit 1
          fi

          PARENTS="$(git show -s --format=%P "$FETCHED_MERGE")"
          read -r FIRST_PARENT SECOND_PARENT EXTRA_PARENT <<< "$PARENTS"
          if ! [[ "$FIRST_PARENT" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$SECOND_PARENT" != "$HEAD_SHA" ] || [ -n "${EXTRA_PARENT:-}" ]; then
            echo "GitHub PR merge ref is not an exact two-parent merge with the triggering head." >&2
            exit 1
          fi

          # Triggers cover only PRs into main. A retarget after the triggering run
          # moves the merge onto another base: the PR must still target main, and
          # the merge base must be on it (a branch cut from main passes ancestry alone).
          git fetch --no-tags origin "+refs/heads/main:refs/autoflow/accounting-main"
          if ! git merge-base --is-ancestor "$FIRST_PARENT" refs/autoflow/accounting-main; then
            echo "PR merge base $FIRST_PARENT is not on main; the PR was retargeted or its merge ref is stale." >&2
            exit 1
          fi
          live_base_ref="$(
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -r '.base.ref // empty'
          )"
          if [ "$live_base_ref" != "main" ]; then
            echo "PR now targets '$live_base_ref', not main; refusing the retargeted PR." >&2
            exit 1
          fi

          echo "TESTED_SHA=$FETCHED_MERGE" >> "$GITHUB_ENV"
          echo "base_sha=$FIRST_PARENT" >> "$GITHUB_OUTPUT"
          echo "tested_sha=$FETCHED_MERGE" >> "$GITHUB_OUTPUT"
          echo "preview_ref=refs/pull/${PR_NUMBER}/merge" >> "$GITHUB_OUTPUT"
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: Decide whether PR backend inputs changed without executing candidate code
        id: backend_inputs
        if: github.event_name == 'workflow_run' && steps.provenance.outputs.stale == 'false'
        working-directory: trusted
        env:
          BASE_SHA: ${{ steps.provenance.outputs.base_sha }}
          TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}
        run: node scripts/accountingRehearsalPathGateCli.mjs

      - name: Mark trusted accounting rehearsal pending
        if: github.event_name == 'workflow_run' && steps.provenance.outputs.stale == 'false' && steps.backend_inputs.outputs.run_rehearsal == 'true'
        env:
          TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const [state, context, description, targetUrl] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({state, context, description, target_url: targetUrl}));
          ' pending autoflow/trusted-accounting-rehearsal "Trusted accounting rehearsal is testing the exact PR merge." "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            --data "$payload" >/dev/null

      - name: Checkout exact tested PR merge as candidate backend source
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.provenance.outputs.tested_sha }}
          path: candidate
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        with:
          version: 11.13.0

      - name: Use Node.js
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install trusted rehearsal dependencies
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── SCRUM-892: both events rehearse on a runner-local backend ────────────
      # Owner ruling SCRUM-892 c24441 moves the pull-request AND the release
      # rehearsal here (it extends option A, c24422, which covered pull requests
      # only). The backend is a disposable self-hosted Convex container on this
      # runner, pinned by digest in scripts/localConvexBackend.mjs, published on
      # 127.0.0.1 only, given no runner secret, and removed by the always() step
      # at the end of this job. No cloud preview is created, so a rehearsal
      # costs no Convex quota. Same cases, same 39-case evidence contract, same
      # check names. Accepted residual gap: see the deploy step below.
      - name: Start the local Convex backend
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs start

      # Set BEFORE the candidate deploy: convex/auth.config.ts is evaluated at
      # deploy time. Sets exactly the allowlisted names (public origins or
      # Cloudflare's published test secret), then fails unless the backend
      # reports exactly those names. Replaces the cloud "scrub" step.
      - name: Set and verify the local backend environment allowlist before candidate execution
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      # SCRUM-350: the candidate backend is never deployed by candidate code.
      # Staging holds no secret: it copies convex/ and lib/ as data, refuses
      # links, .wasm and nested package.json, and requires the candidate's
      # dependency files to be byte-identical to trusted's. The audit then runs
      # the trusted CLI's bundle calls with no credential and no network, and
      # requires every file they are modelled reading to lie inside the stage
      # or trusted node_modules (a model, not a proof: SCRUM-745).
      - name: Stage exact candidate backend as data
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        run: node trusted/scripts/intelligence/stageCandidateBackend.mjs
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          STAGE_ROOT: ${{ runner.temp }}/candidate-backend
          STAGE_MANIFEST_PATH: ${{ runner.temp }}/candidate-backend-manifest.json
          TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}

      - name: Audit staged backend inputs without credentials
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        run: |
          set -euo pipefail
          docker run --rm \
            --name autoflow-staged-backend-input-audit \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$RUNNER_TEMP/candidate-backend:/app:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/node_modules:/app/node_modules:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/scripts/intelligence/auditStagedBackendInputs.mjs:/audit/auditStagedBackendInputs.mjs:ro" \
            --workdir /app \
            --env HOME=/tmp/home \
            node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node /audit/auditStagedBackendInputs.mjs

      - name: Deploy staged candidate backend with trusted Convex CLI
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          set -euo pipefail

          case "${AUTOFLOW_LOCAL_CONVEX_CONTAINER:-}" in
            autoflow-local-convex-*) ;;
            *)
              echo "No local Convex container was recorded by the start step." >&2
              exit 1
              ;;
          esac

          # The TRUSTED Convex CLI from the trusted lockfile, in a container that
          # sees exactly the staged backend and trusted node_modules, read-only,
          # with no package manager, typecheck or codegen. It joins the BACKEND
          # container's network namespace (the form browser-attack-swarm.yml
          # uses), so it reaches the backend at 127.0.0.1:3210; that namespace is
          # on Docker's default bridge, so runner services listening on all
          # interfaces and outbound networking stay reachable, while services
          # bound to the runner's 127.0.0.1 do not. URL and admin key are
          # inherited by NAME, never in argv; the key controls only this job's
          # backend. Once deployed, candidate "use node" actions can mint an
          # admin key (PR #757 round 5): the mark/verify tripwire detects the
          # TRIPWIRE.verified changes, it prevents nothing. That residual gap is
          # accepted for the pull request and the release (owner rulings
          # SCRUM-892 c24422 option A, extended by c24441).
          docker run --rm \
            --name autoflow-trusted-staged-backend-deploy \
            --network "container:${AUTOFLOW_LOCAL_CONVEX_CONTAINER}" \
            --read-only \
            --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$RUNNER_TEMP/candidate-backend:/app:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/node_modules:/app/node_modules:ro" \
            --workdir /app \
            --env HOME=/tmp/home \
            --env CONVEX_SELF_HOSTED_URL \
            --env CONVEX_SELF_HOSTED_ADMIN_KEY \
            node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node /app/node_modules/convex/bin/main.js deploy --typecheck disable --codegen disable --yes

      # The disposable-preview marker is minted by the TRUSTED CLI after the
      # candidate deploy, and `mark` records the tripwire baseline first.
      - name: Mint the disposable-preview marker with the trusted CLI
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Seed synthetic QA dealership on the local backend from trusted main
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Run local accounting rehearsal from trusted main
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: |
          REHEARSAL_TESTED_SHA="$TESTED_SHA" node scripts/accountingPreviewRehearsal.mjs > rehearsal-evidence.json || status=$?
          cat rehearsal-evidence.json
          exit "${status:-0}"
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      # PR #757 round 5: re-reads the backend from the runner after the last
      # case and fails the job unless every TRIPWIRE.verified item
      # (scripts/localConvexBackend.mjs) still equals what `mark` recorded.
      # always(): verify runs even after a failed or skipped earlier step, and a
      # missing baseline refuses. The run condition stays, because a pull
      # request that changes no backend input starts no backend at all.
      - name: Verify the local backend was not changed during the run
        if: always() && steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Refuse incomplete or wrong-target local evidence
        if: steps.provenance.outputs.stale == 'false' && (github.event_name == 'repository_dispatch' || steps.backend_inputs.outputs.run_rehearsal == 'true')
        working-directory: trusted
        run: node scripts/validateAccountingReleaseEvidence.mjs rehearsal-evidence.json
        env:
          EXPECTED_DEPLOYMENT_TYPE: local
          EXPECTED_TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}
          EXPECTED_PREVIEW_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}

      - name: Upload trusted rehearsal evidence
        if: always() && steps.provenance.outputs.stale == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-accounting-rehearsal-evidence
          path: |
            trusted/rehearsal-evidence.json
            trusted/backend-input-evidence.json
          if-no-files-found: warn
          retention-days: 14

      # SCRUM-892: always, so a failed or cancelled job leaves no container
      # behind. Idempotent when the start step never ran.
      - name: Stop the local Convex backend
        if: always()
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs stop

  verdict:
    name: trusted-accounting-rehearsal-verdict
    needs: rehearsal
    if: >-
      always() &&
      needs.rehearsal.outputs.tested_sha != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - name: Publish NOT_APPLICABLE with a neutral PR-only check
        if: needs.rehearsal.outputs.run_rehearsal == 'false' && needs.rehearsal.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.rehearsal.outputs.tested_sha }}
          BASE_SHA: ${{ needs.rehearsal.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const env = process.env;
            process.stdout.write(JSON.stringify({
              name: "autoflow/trusted-accounting-rehearsal",
              head_sha: env.TESTED_SHA,
              status: "completed", conclusion: "neutral",
              details_url: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
              output: {
                title: "NOT_APPLICABLE: no backend input changed",
                summary: `Base SHA: ${env.BASE_SHA}\nHead SHA: ${env.HEAD_SHA}\nNo backend input changed. No preview was created and no cases ran. This is not a pass.`,
              },
            }));
          ')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs" \
            --data "$payload" >/dev/null

      - name: Publish trusted accounting rehearsal verdict
        if: needs.rehearsal.outputs.run_rehearsal != 'false' || needs.rehearsal.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.rehearsal.outputs.tested_sha }}
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Trusted accounting rehearsal did not complete successfully."
          if [ "$REHEARSAL_RESULT" = "success" ]; then
            state=success
            description="Trusted accounting rehearsal passed on the local Convex backend."
          fi
          payload="$(node -e '
            const [state, context, description, targetUrl] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({state, context, description, target_url: targetUrl}));
          ' "$state" autoflow/trusted-accounting-rehearsal "$description" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            --data "$payload" >/dev/null
          if [ "$state" != "success" ]; then
            exit 1
          fi

  release_verdict:
    # A skipped job still publishes a check run. Give PR-triggered runs a
    # different name so their skipped jobs cannot poison the release gate.
    # A stale or malformed dispatch also fails visibly under the other name;
    # it must not burn the current main tip's one allowed release verdict.
    # GitHub expression string equality ignores case, so the name depends on
    # the case-sensitive shell preflight rather than a payload/SHA comparison.
    name: ${{ (github.event_name == 'repository_dispatch' && needs.dispatch_preflight.outputs.exact_sha == 'true') && 'trusted-accounting-release-verdict' || 'trusted-accounting-release-not-dispatched' }}
    needs: [dispatch_preflight, rehearsal]
    if: always() && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse unless exact-SHA rehearsal passed
        env:
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
          TESTED_SHA: ${{ needs.rehearsal.outputs.tested_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL_RESULT" != success ] || [ "$TESTED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Trusted release rehearsal did not pass at this exact main SHA." >&2
            exit 1
          fi
