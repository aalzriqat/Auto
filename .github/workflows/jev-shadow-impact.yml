name: Jev Shadow Impact

on:
  # Secret-bearing analysis runs from the trusted workflow on main after the
  # ordinary PR invariant workflow finishes. We never execute PR code here.
  workflow_run:
    workflows: [ "Invariant Governance" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA for manual shadow evaluation"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA for manual shadow evaluation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  shadow-impact:
    name: advisory-impact
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require trusted ref for manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual Jev shadow evaluation must be dispatched from main." >&2
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current pull-request base and fetch head as data only
        id: pr-context
        if: github.event_name == 'workflow_run'
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "workflow_run did not provide a valid PR number" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "workflow_run did not provide an exact head SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/autoflow/jev-pr-head" \
            "refs/pull/${PR_NUMBER}/merge:refs/autoflow/jev-pr-merge"
          FETCHED_HEAD="$(git rev-parse refs/autoflow/jev-pr-head)"
          FETCHED_MERGE="$(git rev-parse refs/autoflow/jev-pr-merge)"
          if [ "$FETCHED_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Fetched PR head does not match workflow_run head SHA" >&2
            exit 1
          fi
          PARENTS="$(git show -s --format=%P "$FETCHED_MERGE")"
          read -r FIRST_PARENT SECOND_PARENT EXTRA_PARENT <<< "$PARENTS"
          if ! [[ "$FIRST_PARENT" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$SECOND_PARENT" != "$EXPECTED_HEAD_SHA" ] || [ -n "${EXTRA_PARENT:-}" ]; then
            echo "GitHub PR merge ref is not an exact two-parent merge with the triggering head." >&2
            exit 1
          fi

          # Triggers cover only PRs into main. A retarget after the triggering run
          # moves the merge onto another base, so the base must still be on main.
          git fetch --no-tags origin "+refs/heads/main:refs/autoflow/jev-main"
          if ! git merge-base --is-ancestor "$FIRST_PARENT" refs/autoflow/jev-main; then
            echo "PR merge base $FIRST_PARENT is not on main; the PR was retargeted or its merge ref is stale." >&2
            exit 1
          fi
          echo "base_sha=$FIRST_PARENT" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Install trusted main dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Jev impact harness
        run: pnpm test:jev-impact
        env:
          NODE_ENV: test

      - name: Run Jev shadow impact
        run: pnpm jev:shadow-impact
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event_name == 'workflow_run' && steps.pr-context.outputs.base_sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && steps.pr-context.outputs.head_sha || github.event_name == 'push' && github.sha || inputs.head_sha }}

      - name: Publish sanitized Jev summary
        if: always()
        run: |
          if [ -f artifacts/jev-shadow-summary.md ]; then
            cat artifacts/jev-shadow-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Jev advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-shadow-impact
          path: |
            artifacts/jev-shadow-impact.json
            artifacts/jev-shadow-summary.md
          if-no-files-found: warn
          retention-days: 14
