name: Sonar Bootstrap PR 325

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sonar-bootstrap-325:
    name: sonar-bootstrap-325
    if: >-
      github.event.pull_request.number == 325 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/scrum-350-browser-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout exact PR 325 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      # No repository secret is present during package installation or tests.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Sonar coverage without credentials
        run: pnpm test:coverage:sonar
        env:
          NODE_ENV: test

      - name: Sanitize bootstrap scanner inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type l -print -quit | grep -q .; then
            echo "::error::Bootstrap Sonar refuses symlinks in candidate source."
            exit 1
          fi

          LCOV="coverage/lcov.info"
          if [ ! -f "$LCOV" ]; then
            echo "::error::Bootstrap coverage does not contain coverage/lcov.info."
            exit 1
          fi
          bytes="$(wc -c < "$LCOV")"
          if [ "$bytes" -gt 52428800 ]; then
            echo "::error::lcov.info exceeds the 50 MiB trusted input limit."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const lcov = fs.readFileSync("coverage/lcov.info", "utf8");
          for (const line of lcov.split(/\r?\n/)) {
            if (!line.startsWith("SF:")) continue;
            const source = line.slice(3).replaceAll("\\", "/");
            if (
              source.startsWith("/") ||
              source.split("/").includes("..") ||
              !/^(convex|scripts)\//.test(source)
            ) {
              throw new Error("Bootstrap Sonar refuses out-of-scope LCOV source path: " + source);
            }
          }
          NODE

          # Scanner policy comes from the protected base, not candidate config.
          git show "$BASE_SHA:sonar-project.properties" > "$RUNNER_TEMP/sonar-project.properties"
          cp "$RUNNER_TEMP/sonar-project.properties" sonar-project.properties

      # This is the only step in any direct PR workflow allowed to receive a
      # repository secret, and only for the one-time PR #325 bootstrap.
      - name: SonarCloud bootstrap scan for PR 325 only
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=aalzriqat_Auto
            -Dsonar.organization=aalzriqat
            -Dsonar.pullrequest.key=325
            -Dsonar.pullrequest.branch=agent/scrum-350-browser-swarm
            -Dsonar.pullrequest.base=main
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
