name: Regression library (nightly and release)

# SCRUM-761 R3 / SCRUM-760 item 3: the FULL regression library, every active record,
# on a runner-local Convex backend. Pull requests run the money and permission
# scenarios plus the replays of the screens they touch in scenario-runner.yml;
# this workflow is the other two cadences:
#
#   nightly   schedule (main's tip)
#   release   repository_dispatch `autoflow-release-regression-library` with
#             client_payload.commit_sha = main's full current SHA, sent by the
#             release operator next to the accounting rehearsal dispatch
#
# Owner ruling c24441 (SCRUM-892): the one job gives itself a per-job LOCAL
# self-hosted Convex backend (scripts/localConvexBackend.mjs) and goes through the
# same mark/verify tripwire as Trusted Main E2E. No Convex cloud credential,
# preview, deployment quota or cleanup identity exists in this file.
#
# A scenario that cannot run is a FAIL, never a skip. scripts/regression/prRunner.mjs
# --tier full gives every active record one verdict: backend records from a serial
# Vitest run, browser records from the Playwright JSON reports of this same job.
# A report that is missing, a title that did not run, and a skipped, failed or
# flaky (passed only on retry) execution all fail. Output is counts, failure codes
# and scenario ids only (public repository).
# See docs/adr/2026-11-04-library-execution-cadence.md.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [autoflow-release-regression-library]

permissions:
  contents: read

concurrency:
  group: regression-library-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-library:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # A release dispatch must name main's full current tip, and the run must be
      # exactly that commit. repository_dispatch always loads the default branch.
      - name: Refuse a release dispatch that is not main's current tip
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full 40-character SHA"; exit 1; }
          TIP="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [ "$REQUESTED_SHA" = "$GITHUB_SHA" ] && [ "$REQUESTED_SHA" = "$TIP" ] || { echo "release dispatch does not name main's current tip"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.client_payload.commit_sha }}

      # Static projects: no app server and no backend. Failures are judged per record by the runner,
      # so this step keeps going and fails at the end.
      - name: Run the static visual projects
        run: |
          set -uo pipefail
          status=0
          mkdir -p regression-reports
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/visual.json pnpm run test:visual:deal-cockpit --reporter=json || status=1
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-visual.json pnpm exec playwright test -c playwright.opening.visual.config.ts --reporter=json || status=1
          exit "$status"
        env:
          CI: true

      - name: Start the local Convex backend
        run: node scripts/localConvexBackend.mjs start

      - name: Set and verify the local backend environment allowlist
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Deploy main to the local Convex backend
        run: pnpm exec convex deploy --typecheck enable --yes
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}

      - name: Mint the disposable-preview marker and record the tripwire baseline
        run: node scripts/localConvexBackend.mjs mark
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Seed the QA dealership on the local backend
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      # The three backend-backed Playwright configs (authenticated tests, scenario matrix and explorer
      # walks, terminal opening witnesses). Same commands as trusted-main-e2e.yml, deal-scenarios-e2e.yml
      # and the opening proof; a red config does not stop the others, and the step still fails.
      # Role-fixture specs (audit-role-access) run only in pilot-role-audit.yml: records bound to them
      # have no report here and fail ROLE_AUDIT_EVIDENCE_NOT_JOINED until that evidence is joined.
      # The legacy manual-journal seed (SCRUM-795) is requested only by trusted-main-e2e.yml, which
      # legacyManualJournalSeedScope.test.ts enforces. Its approve-door test is therefore not
      # registered here, and a record bound to it fails BROWSER_REPLAY_NOT_EXECUTED, never skips.
      - name: Run the backend-backed browser projects
        id: browser
        run: |
          set -uo pipefail
          status=0
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/tests.json pnpm exec playwright test --reporter=json || status=1
          CROSS_SCREEN_ORACLE=1 PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/scenarios.json pnpm exec playwright test -c playwright.scenarios.config.ts --reporter=json || status=1
          PLAYWRIGHT_JSON_OUTPUT_NAME=regression-reports/opening-proof.json pnpm exec playwright test -c playwright.opening-proof.config.ts --reporter=json || status=1
          exit "$status"
        env:
          AUTOFLOW_LOCAL_CONVEX_CI: "1"
          JEV_FORM_EXPLORER: "0"
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          OPENING_PROOF_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI: true

      # Trusted tripwire: fails the job unless the backend still equals what
      # `mark` recorded. Exactly always(): a red suite still gets its check, and
      # a missing or emptied baseline makes verify refuse instead of skipping it.
      - name: Verify the local backend was not changed during the run
        if: always()
        run: node scripts/localConvexBackend.mjs verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Stop the local Convex backend
        if: always()
        run: node scripts/localConvexBackend.mjs stop

      # The verdict. Backend records run here under Vitest (convex-test, no backend needed); browser
      # records are read from the reports above. Runs even when an earlier step failed.
      - name: Judge every active record
        if: always()
        run: node scripts/regression/prRunner.mjs --tier full --playwright-report regression-reports/visual.json --playwright-report regression-reports/opening-visual.json --playwright-report regression-reports/tests.json --playwright-report regression-reports/scenarios.json --playwright-report regression-reports/opening-proof.json > regression-library-summary.json
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=5632

      # Raw reports contain error text, console output and attachment bodies.
      # Public artifacts carry only the runner's counts, codes and scenario ids.
      - name: Upload regression library summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regression-library-summary
          path: regression-library-summary.json
          if-no-files-found: error
          retention-days: 14
