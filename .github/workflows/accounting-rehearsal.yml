name: Accounting Cloud Rehearsal

# Direct pull-request workflows are untrusted. This lane validates the
# rehearsal harness itself with no repository secrets; the real cloud rehearsal
# is executed by Trusted Accounting Cloud Rehearsal via workflow_run.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate accounting rehearsal harness without credentials
        run: >-
          pnpm exec vitest run
          scripts/accountingPreviewRehearsal.test.ts
          scripts/accountingRehearsalCases.test.ts
          scripts/accountingRehearsalPathGate.test.ts
          scripts/accountingRehearsalPathGateCli.test.ts
          --maxWorkers=1
