name: SPIKE SCRUM-892 local Convex accounting rehearsal (never merged)

# Spike copy of trusted-accounting-rehearsal.yml (repository_dispatch, cloud
# `--preview-create`) that runs the same public API cases against a self-hosted
# Convex backend started inside this runner (scripts/localConvexBackend.mjs).
#
# It is push-triggered on the spike branch only, so it can never run from main or
# from a pull request. It posts no commit status and no check, holds no Convex
# cloud credential, and its job name is NOT `trusted-accounting-release-verdict`
# or any name the release guard reads (.github/release-waivers.json).
on:
  push:
    branches: ["claude/scrum892-spike"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-892-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike-rehearsal:
    name: spike-rehearsal
    if: github.ref == 'refs/heads/claude/scrum892-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # The real workflow's release path is repository_dispatch on main: the full
      # (non-PR) case set. The spike emulates that path.
      EVENT_NAME: repository_dispatch
      TESTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      # The spike has no separate candidate: the tested commit is the controller.
      # (fd1BankContractInputs reads ../candidate/convex as data.)
      - name: Checkout exact tested commit as candidate backend source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install trusted rehearsal dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      # SCRUM-892: replaces "Name and recreate disposable rehearsal preview",
      # "Pin ... for cleanup", "Refuse release rehearsal without a pinned cleanup
      # identity" and "Scrub ... environment". No cloud deployment exists.
      - name: Start the local Convex backend
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs start

      # Set BEFORE the candidate deploy (convex/auth.config.ts is evaluated at
      # deploy time); fails unless the backend holds exactly the five allowlisted
      # names, which is the check the cloud "scrub" step performed.
      - name: Set and verify the local backend environment allowlist
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs env
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Stage exact candidate backend as data
        run: node trusted/scripts/intelligence/stageCandidateBackend.mjs
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          STAGE_ROOT: ${{ runner.temp }}/candidate-backend
          STAGE_MANIFEST_PATH: ${{ runner.temp }}/candidate-backend-manifest.json
          TESTED_SHA: ${{ github.sha }}

      - name: Audit staged backend inputs without credentials
        run: |
          set -euo pipefail
          docker run --rm \
            --name autoflow-staged-backend-input-audit \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$RUNNER_TEMP/candidate-backend:/app:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/node_modules:/app/node_modules:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/scripts/intelligence/auditStagedBackendInputs.mjs:/audit/auditStagedBackendInputs.mjs:ro" \
            --workdir /app \
            --env HOME=/tmp/home \
            node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node /audit/auditStagedBackendInputs.mjs

      # Same deploy step as the converted swarm: the trusted CLI in a read-only,
      # capability-free container that joins the BACKEND container's network
      # namespace, so the deploy URL is the same loopback literal everywhere.
      - name: Deploy staged candidate backend with trusted Convex CLI
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          set -euo pipefail

          case "${AUTOFLOW_LOCAL_CONVEX_CONTAINER:-}" in
            autoflow-local-convex-*) ;;
            *)
              echo "No local Convex container was recorded by the start step." >&2
              exit 1
              ;;
          esac

          docker run --rm \
            --name autoflow-trusted-staged-backend-deploy \
            --network "container:${AUTOFLOW_LOCAL_CONVEX_CONTAINER}" \
            --read-only \
            --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$RUNNER_TEMP/candidate-backend:/app:ro" \
            --volume "$GITHUB_WORKSPACE/trusted/node_modules:/app/node_modules:ro" \
            --workdir /app \
            --env HOME=/tmp/home \
            --env CONVEX_SELF_HOSTED_URL \
            --env CONVEX_SELF_HOSTED_ADMIN_KEY \
            node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node /app/node_modules/convex/bin/main.js deploy --typecheck disable --codegen disable --yes

      - name: Mint the disposable-preview marker with the trusted CLI
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs mark

      - name: Seed synthetic QA dealership from trusted main
        working-directory: trusted
        run: node scripts/e2ePreviewBootstrap.mjs
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Run accounting rehearsal from trusted main against the local backend
        working-directory: trusted
        run: |
          REHEARSAL_TESTED_SHA="$TESTED_SHA" node scripts/accountingPreviewRehearsal.mjs > rehearsal-evidence.json || status=$?
          cat rehearsal-evidence.json
          exit "${status:-0}"
        env:
          CONVEX_SELF_HOSTED_URL: ${{ env.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ env.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Refuse incomplete or wrong-target evidence
        working-directory: trusted
        run: node scripts/validateAccountingReleaseEvidence.mjs rehearsal-evidence.json
        env:
          EXPECTED_TESTED_SHA: ${{ github.sha }}
          EXPECTED_LOCAL_BACKEND: "1"
          EXPECTED_PREVIEW_NAME: local-self-hosted
          EXPECTED_PREVIEW_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL }}

      # Spike-only: re-prints the rehearsal's own banner (it went to stderr of the
      # step above) and fails unless it is exactly "every required case passed".
      - name: Assert the case count (39 of 39)
        working-directory: trusted
        run: node scripts/spike892/assertRehearsalCaseCount.mjs rehearsal-evidence.json

      - name: Upload spike rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-892-rehearsal-evidence
          path: trusted/rehearsal-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the local Convex backend
        if: always()
        working-directory: trusted
        run: node scripts/localConvexBackend.mjs stop
