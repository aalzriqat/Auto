name: Trusted Browser Attack Swarm

on:
  workflow_run:
    workflows: [ "E2E Tests (Playwright)" ]
    types: [ completed ]

permissions:
  contents: read
  actions: read

concurrency:
  # Deliberately the same PR-level group used by the triggering Playwright
  # workflow. A newer E2E run therefore cancels an older swarm before it can
  # recreate the same named preview underneath that swarm.
  group: playwright-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: trusted-plan
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      worker_count: ${{ steps.plan.outputs.worker_count }}
      worker_matrix: ${{ steps.plan.outputs.worker_matrix }}
      impacted_invariants_json: ${{ steps.plan.outputs.impacted_invariants_json }}
      preview_name: ${{ steps.plan.outputs.preview_name }}
      convex_cloud_url: ${{ steps.plan.outputs.convex_cloud_url }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      pr_number: ${{ steps.plan.outputs.pr_number }}

    steps:
      - name: Checkout trusted control plane from immutable workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # workflow_run loads this workflow from the default branch. Pin the
          # exact commit that defined this run; never chase a moving main ref.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: trusted
          # The token is read-only in this workflow and is retained only so
          # the trusted checkout can fetch the exact PR head as Git data.
          persist-credentials: true

      - name: Fetch and verify exact PR head and tested merge commit as data only
        working-directory: trusted
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          EXPECTED_TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "workflow_run did not provide a valid PR number" >&2
            exit 1
          fi
          for value in "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_TESTED_SHA"; do
            if ! [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "workflow_run did not provide exact base/head/tested SHAs" >&2
              exit 1
            fi
          done

          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/autoflow/pr-head" \
            "refs/pull/${PR_NUMBER}/merge:refs/autoflow/pr-merge"

          FETCHED_HEAD="$(git rev-parse refs/autoflow/pr-head)"
          FETCHED_MERGE="$(git rev-parse refs/autoflow/pr-merge)"
          if [ "$FETCHED_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Fetched PR head does not match workflow_run PR head SHA" >&2
            exit 1
          fi
          if [ "$FETCHED_MERGE" != "$EXPECTED_TESTED_SHA" ]; then
            echo "Fetched PR merge commit does not match the triggering workflow SHA" >&2
            exit 1
          fi

          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          git cat-file -e "${EXPECTED_HEAD_SHA}^{commit}"
          git cat-file -e "${EXPECTED_TESTED_SHA}^{commit}"

          PARENTS="$(git show -s --format=%P "$EXPECTED_TESTED_SHA")"
          read -r FIRST_PARENT SECOND_PARENT EXTRA_PARENT <<< "$PARENTS"
          if [ "$FIRST_PARENT" != "$EXPECTED_BASE_SHA" ] || [ "$SECOND_PARENT" != "$EXPECTED_HEAD_SHA" ] || [ -n "${EXTRA_PARENT:-}" ]; then
            echo "Triggering workflow SHA is not the exact two-parent PR merge of base + head." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install trusted main dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify trusted impact and browser control plane
        working-directory: trusted
        run: |
          set -euo pipefail
          pnpm test:jev-impact
          pnpm test:browser-swarm
        env:
          NODE_ENV: test

      - name: Derive mandatory impact from trusted main
        working-directory: trusted
        run: pnpm browser-swarm:trusted-impact
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}

      - name: Download triggering E2E preview descriptor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-preview-descriptor"
          curl --fail --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/artifacts.json"

          ARTIFACT_ID="$(node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const matches = (payload.artifacts || []).filter(
              (artifact) => artifact.name === "e2e-preview-descriptor" && artifact.expired !== true,
            );
            if (matches.length !== 1) {
              throw new Error("Expected exactly one live e2e-preview-descriptor artifact");
            }
            const artifact = matches[0];
            if (!Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes > 16384) {
              throw new Error("e2e-preview-descriptor artifact exceeds the 16 KiB trusted handoff limit");
            }
            process.stdout.write(String(artifact.id));
          ' "$RUNNER_TEMP/artifacts.json")"

          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             -o "$RUNNER_TEMP/e2e-preview-descriptor.zip"

          mapfile -t ZIP_ENTRIES < <(
            unzip -Z1 "$RUNNER_TEMP/e2e-preview-descriptor.zip"
          )
          if [ "${#ZIP_ENTRIES[@]}" -ne 1 ] || [ "${ZIP_ENTRIES[0]}" != "e2e-preview-descriptor.json" ]; then
            echo "Descriptor artifact must contain exactly e2e-preview-descriptor.json at archive root." >&2
            exit 1
          fi

          unzip -p "$RUNNER_TEMP/e2e-preview-descriptor.zip"             e2e-preview-descriptor.json             > "$RUNNER_TEMP/e2e-preview-descriptor/e2e-preview-descriptor.json"

          DESCRIPTOR_BYTES="$(wc -c < "$RUNNER_TEMP/e2e-preview-descriptor/e2e-preview-descriptor.json")"
          if [ "$DESCRIPTOR_BYTES" -gt 8192 ]; then
            echo "Descriptor JSON exceeds the 8 KiB trusted parsing limit." >&2
            exit 1
          fi

      - name: Resolve named Convex preview from trusted control plane
        working-directory: trusted
        run: node scripts/intelligence/convexPreviewAuthority.mjs
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Assemble trusted run and fail closed on unsupported impact
        id: plan
        working-directory: trusted
        run: pnpm browser-swarm:prepare-trusted-run
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BROWSER_SWARM_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          PREVIEW_DESCRIPTOR_PATH: ${{ runner.temp }}/e2e-preview-descriptor/e2e-preview-descriptor.json

      - name: Publish trusted plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-browser-swarm-plan
          path: |
            trusted/artifacts/browser-swarm-trusted-impact.json
            trusted/artifacts/browser-swarm-convex-authority.json
            trusted/artifacts/browser-swarm-trusted-run.json
          if-no-files-found: error
          retention-days: 14

  attack-worker:
    name: attack-worker-${{ matrix.worker_index }}
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.worker_matrix) }}

    steps:
      - name: Checkout trusted browser controller from immutable workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact tested PR merge as application code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Install trusted controller dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install trusted Chromium
        working-directory: trusted
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve test-only Clerk public JWT verification key
        working-directory: trusted
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *)
              echo "Trusted browser swarm refuses a non-test Clerk publishable key." >&2
              exit 1
              ;;
          esac
          case "$CLERK_SECRET_KEY" in
            sk_test_*) ;;
            *)
              echo "Trusted browser swarm refuses a non-test Clerk secret key." >&2
              exit 1
              ;;
          esac

          JWT_KEY_PATH="$RUNNER_TEMP/clerk-jwt-key.pem"
          node scripts/intelligence/clerkPublicJwtKey.mjs "$JWT_KEY_PATH"
          {
            echo 'CLERK_JWT_KEY<<__AUTOFLOW_CLERK_JWT_KEY__'
            cat "$JWT_KEY_PATH"
            echo '__AUTOFLOW_CLERK_JWT_KEY__'
          } >> "$GITHUB_ENV"

      - name: Authenticate E2E seats on trusted main frontend
        working-directory: trusted
        run: pnpm exec playwright test playwright/tests/auth.setup.ts --project=setup
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex_cloud_url }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_LOGIN_VERIFICATION_CODE: ${{ secrets.E2E_LOGIN_VERIFICATION_CODE }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}
          E2E_APPROVER_PASSWORD: ${{ secrets.E2E_APPROVER_PASSWORD }}

      - name: Build exact candidate frontend in isolated container
        run: |
          set -euo pipefail
          docker run --rm             --name "autoflow-swarm-build-${{ matrix.worker_index }}"             --network bridge             --cap-drop ALL             --security-opt no-new-privileges             --volume "$GITHUB_WORKSPACE/candidate:/app"             --workdir /app             --env HOME=/tmp/home             --env NEXT_PUBLIC_CONVEX_URL             --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY             --env CLERK_JWT_KEY             --env NEXT_PUBLIC_TURNSTILE_SITE_KEY             --env NEXT_PUBLIC_APP_URL             node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5             sh -lc 'corepack enable && corepack prepare pnpm@11.13.0 --activate && pnpm install --frozen-lockfile --ignore-scripts && pnpm build'
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex_cloud_url }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Start exact candidate frontend in isolated container
        run: |
          set -euo pipefail
          CANDIDATE_CONTAINER="autoflow-swarm-candidate-${{ matrix.worker_index }}"
          CANDIDATE_NETWORK="autoflow-swarm-net-${{ matrix.worker_index }}"
          echo "CANDIDATE_CONTAINER=$CANDIDATE_CONTAINER" >> "$GITHUB_ENV"
          echo "CANDIDATE_NETWORK=$CANDIDATE_NETWORK" >> "$GITHUB_ENV"

          # Runtime candidate code gets no default route to the Internet. The
          # trusted host can still reach its published loopback port.
          docker network create --internal "$CANDIDATE_NETWORK" >/dev/null

          docker run --detach --rm             --name "$CANDIDATE_CONTAINER"             --network "$CANDIDATE_NETWORK"             --publish 127.0.0.1:3000:3000             --cap-drop ALL             --security-opt no-new-privileges             --volume "$GITHUB_WORKSPACE/candidate:/app"             --workdir /app             --env HOME=/tmp/home             --env NEXT_PUBLIC_CONVEX_URL             --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY             --env CLERK_JWT_KEY             --env NEXT_PUBLIC_TURNSTILE_SITE_KEY             --env NEXT_PUBLIC_APP_URL             node:22.21.1-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5             sh -lc 'corepack enable && corepack prepare pnpm@11.13.0 --activate && pnpm exec next start -H 0.0.0.0 -p 3000'

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error               http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$CANDIDATE_CONTAINER" >&2 || true
          echo "Exact candidate frontend did not become healthy on isolated loopback." >&2
          exit 1
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex_cloud_url }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Execute trusted browser missions
        working-directory: trusted
        run: pnpm exec playwright test playwright/tests/browser-swarm.spec.ts --project=chromium --no-deps
        env:
          CI: true
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          BROWSER_SWARM_TRUSTED_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          BROWSER_SWARM_ENABLED: "1"
          BROWSER_SWARM_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          BROWSER_SWARM_WORKER_COUNT: ${{ needs.prepare.outputs.worker_count }}
          BROWSER_SWARM_WORKER_ID: worker-${{ matrix.worker_index }}
          BROWSER_SWARM_IMPACTED_INVARIANTS_JSON: ${{ needs.prepare.outputs.impacted_invariants_json }}
          BROWSER_SWARM_JEV_SUGGESTIONS_JSON: "[]"
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_NAME: ${{ needs.prepare.outputs.preview_name }}
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex_cloud_url }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          E2E_LOGIN_USER: ${{ secrets.E2E_LOGIN_USER }}
          E2E_APPROVER_USER: ${{ secrets.E2E_APPROVER_USER }}

      - name: Stop isolated candidate frontend
        if: always()
        run: |
          if [ -n "${CANDIDATE_CONTAINER:-}" ]; then
            docker rm --force "$CANDIDATE_CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "${CANDIDATE_NETWORK:-}" ]; then
            docker network rm "$CANDIDATE_NETWORK" >/dev/null 2>&1 || true
          fi

      - name: Upload trusted swarm evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-browser-swarm-worker-${{ matrix.worker_index }}
          path: |
            trusted/swarm/
            trusted/playwright-report/
            trusted/test-results/
          if-no-files-found: warn
          retention-days: 14
