name: Sonar PR Report

on:
  workflow_run:
    workflows: [ "Tests" ]
    types: [ completed ]

# Trusted reporter: this workflow is loaded from the default branch after the
# Tests workflow finishes. It never checks out or executes candidate PR code.
permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: sonar-pr-report
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PROJECT_KEY: aalzriqat_Auto
      COMMENT_MARKER: "<!-- autoflow-sonar-pr-report -->"

    steps:
      - name: Skip when Sonar credential is unavailable
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN is unavailable; Sonar PR reporter skipped."

      - name: Fetch Sonar issues and upsert PR report
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          github_api="https://api.github.com"
          sonar_api="https://sonarcloud.io/api"

          current_head="$(
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${github_api}/repos/${REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -r '.head.sha'
          )"

          if [ "${current_head}" != "${WORKFLOW_HEAD_SHA}" ]; then
            echo "::notice::Skipping stale Sonar report for ${WORKFLOW_HEAD_SHA}; PR #${PR_NUMBER} is now at ${current_head}."
            exit 0
          fi

          gate_json=""
          for attempt in 1 2 3 4 5 6; do
            if gate_json="$(
              curl --fail --silent --show-error --retry 2 --retry-all-errors \
                --header "Authorization: Bearer ${SONAR_TOKEN}" \
                --get "${sonar_api}/qualitygates/project_status" \
                --data-urlencode "projectKey=${PROJECT_KEY}" \
                --data-urlencode "pullRequest=${PR_NUMBER}"
            )"; then
              gate_status="$(jq -r '.projectStatus.status // empty' <<<"${gate_json}")"
              if [ -n "${gate_status}" ]; then
                break
              fi
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "::error::Sonar quality-gate status was unavailable after retries."
              exit 1
            fi
            sleep 5
          done

          issues_json="$(
            curl --fail --silent --show-error --retry 2 --retry-all-errors \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --get "${sonar_api}/issues/search" \
              --data-urlencode "componentKeys=${PROJECT_KEY}" \
              --data-urlencode "pullRequest=${PR_NUMBER}" \
              --data-urlencode "issueStatuses=OPEN,CONFIRMED" \
              --data-urlencode "ps=500"
          )"

          gate_status="$(jq -r '.projectStatus.status // "UNKNOWN"' <<<"${gate_json}")"
          issue_count="$(jq -r '.total // (.issues | length)' <<<"${issues_json}")"

          {
            printf '%s\n\n' "${COMMENT_MARKER}"
            printf '## SonarQube Cloud — PR #%s\n\n' "${PR_NUMBER}"
            printf '**Quality Gate:** `%s` · **Open PR issues:** %s · **Analysed head:** `%s`\n\n' \
              "${gate_status}" "${issue_count}" "${WORKFLOW_HEAD_SHA}"

            failed_conditions="$(jq -r '
              [.projectStatus.conditions[]? | select(.status == "ERROR")] |
              if length == 0 then empty
              else .[] |
                "- \(.metricKey): actual \(.actualValue // "n/a"), threshold \(.errorThreshold // "n/a"), comparator \(.comparator // "n/a")"
              end
            ' <<<"${gate_json}")"

            if [ -n "${failed_conditions}" ]; then
              printf '### Failed quality-gate conditions\n\n%s\n\n' "${failed_conditions}"
            fi

            if [ "${issue_count}" -eq 0 ]; then
              printf 'No open Sonar issues are reported for this PR analysis.\n\n'
            else
              printf '### Open issues\n\n'
              printf '| Quality | Severity | Rule | File | Line | Message |\n'
              printf '| --- | --- | --- | --- | ---: | --- |\n'
              jq -r --arg project "${PROJECT_KEY}" '
                .issues[] |
                [
                  (.impacts[0].softwareQuality // .type // "UNKNOWN"),
                  (.impacts[0].severity // .severity // "UNKNOWN"),
                  (.rule // "UNKNOWN"),
                  ((.component // "") | sub(("^" + $project + ":"); "")),
                  ((.line // .textRange.startLine // "-") | tostring),
                  ((.message // "") | gsub("\\|"; "\\\\|") | gsub("[\\r\\n]+"; " "))
                ] |
                "| `\(.[0])` | `\(.[1])` | `\(.[2])` | `\(.[3])` | \(.[4]) | \(.[5]) |"
              ' <<<"${issues_json}"
              printf '\n'
            fi

            printf '_Generated by the trusted `Sonar PR Report` workflow. Candidate PR code was not checked out or executed by this reporter._\n'
          } > sonar-pr-report.md

          cat sonar-pr-report.md >> "${GITHUB_STEP_SUMMARY}"

          comments_json="$(
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${github_api}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          )"

          existing_comment_id="$(
            jq -r --arg marker "${COMMENT_MARKER}" '
              [.[] | select((.body // "") | contains($marker)) | .id][0] // empty
            ' <<<"${comments_json}"
          )"

          jq -Rs '{body: .}' < sonar-pr-report.md > sonar-pr-report-payload.json

          if [ -n "${existing_comment_id}" ]; then
            curl --fail --silent --show-error \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data-binary @sonar-pr-report-payload.json \
              "${github_api}/repos/${REPOSITORY}/issues/comments/${existing_comment_id}" >/dev/null
          else
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data-binary @sonar-pr-report-payload.json \
              "${github_api}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" >/dev/null
          fi
