name: Trusted Review Evidence

# SCRUM-644 S3b-2. Audits every open pull request's review-evidence record from
# main's own copy of this workflow and code. REPORT-ONLY: the check-run it
# writes is a pointer to the run artifact, not authority, and is NOT a required
# check. readAuditBinding (scripts/intelligence/reviewAuditAuthority.mjs) is the
# only reader that counts.
#
# No pull_request and no workflow_dispatch trigger: both run a copy of this file
# chosen by someone other than main. workflow_run and push run main's copy.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Invariant Governance"]
    types: [completed]

permissions:
  checks: write
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: tre-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: trusted-review-evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main's revision of this workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse anything but main's tip
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          checkout="$(git rev-parse HEAD)"
          if [ "$main_tip" != "$GITHUB_WORKFLOW_SHA" ] || [ "$checkout" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "checkout $checkout, workflow $GITHUB_WORKFLOW_SHA and main $main_tip are not one commit; a later run will audit the new tip" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Install main's dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Node 22.18+ strips types natively; the controller imports the catalog's .ts.
        run: node scripts/intelligence/reviewAuditControllerCli.mjs

      - name: Upload audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-review-evidence-audit
          path: out/audit-*.json
          if-no-files-found: ignore
          retention-days: 14
