name: Sonar Main

on:
  workflow_run:
    workflows: ["Tests"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonar-main-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    name: scan
    # SCRUM-764: Runs on main when Tests workflow completes, or on manual workflow_dispatch.
    # Reuses the exact same-commit coverage report produced by Tests across 4 slices + mobile + shared.
    # Fails closed on missing, failed, cancelled, stale, truncated, or unverified producer coverage.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Verify producer run conclusion
        if: github.event_name == 'workflow_run'
        env:
          PRODUCER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PRODUCER_WORKFLOW: ${{ github.event.workflow_run.name }}
          PRODUCER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Producer workflow: $PRODUCER_WORKFLOW (run id: ${{ github.event.workflow_run.id }})"
          echo "Producer conclusion: $PRODUCER_CONCLUSION"
          echo "Producer repository: $PRODUCER_REPO (expected: $EXPECTED_REPO)"
          echo "Producer branch: $PRODUCER_BRANCH"

          if [ "$PRODUCER_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Producer repository '$PRODUCER_REPO' does not match '$EXPECTED_REPO'."
            exit 1
          fi

          if [ "$PRODUCER_WORKFLOW" != "Tests" ]; then
            echo "::error::Triggering workflow must be 'Tests', got '$PRODUCER_WORKFLOW'."
            exit 1
          fi

          if [ "$PRODUCER_BRANCH" != "main" ]; then
            echo "::error::Triggering branch must be 'main', got '$PRODUCER_BRANCH'."
            exit 1
          fi

          if [ "$PRODUCER_CONCLUSION" != "success" ]; then
            echo "::error::Producer Tests workflow did not succeed (conclusion: '$PRODUCER_CONCLUSION'); refusing Sonar scan."
            exit 1
          fi

      - name: Checkout target commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve producer run ID
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            TARGET_SHA="${{ github.sha }}"
            echo "Searching for successful Tests run for commit $TARGET_SHA on main..."
            RUN_ID="$(gh run list --workflow=test.yml --commit="$TARGET_SHA" --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful Tests workflow run found for commit $TARGET_SHA on main."
              exit 1
            fi
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage report from Tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          path: coverage
          github-token: ${{ github.token }}
          run-id: ${{ steps.producer.outputs.run_id }}

      - name: Validate coverage artifact provenance and census
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node scripts/validateSonarMainCoverage.mjs coverage . "$EXPECTED_SHA"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
