
# Production Convex deploys, and the rollout that has to follow one.
#
# This exists because a wrapper on a developer's machine could not be made
# binding. `npx convex deploy` still worked next to it, the production
# credential sat on the workstation, and two rounds of review kept finding ways
# out of the sandbox it claimed to be. The boundary has to be somewhere the
# operator is not.
#
# So: the credential lives only in this repository's `production` environment, a
# human other than the requester approves each run, and the whole thing is
# ordered so that verification happens while there is still nothing to steal.
#
# ⚠️ There is deliberately NO rollback mode. Any rollback target predates this
# verification tooling, so the run would deploy and then verify nothing while
# reporting success. Undo by merging a revert and deploying it through this same
# path, with the full checks. Versioned rollback compatibility is separate work.
#
# ⚠️ Requires configuration that is NOT in this file, and the workflow is NOT a
# boundary until it exists — see AGENTS.md:
#   · the `production` environment given a REQUIRED REVIEWER, self-review
#     prevented, admin bypass disabled, and deployment branches restricted to
#     `main`. An environment with no protection rules gates NOTHING:
#     `environment:` on a rule-less environment is a no-op and the job starts
#     immediately, like any other.
#   · `CONVEX_PROD_DEPLOYMENT`     — environment VARIABLE (not a secret), the
#                                    exact production deployment name
#   · `CONVEX_PROD_DEPLOY_KEY`     — environment secret, `deployment:deploy` only
#   · `CONVEX_PROD_OPERATOR_KEY`   — environment secret, `runInternalMutations`
#                                    + `runInternalQueries` only
#   · the workstation production deploy key REVOKED once this is proven
#
# ⚠️ The secret names are deliberately NOT `CONVEX_DEPLOY_KEY`. A repository
# secret of that name exists and is consumed by `playwright.yml`. Repository
# secrets are visible to every job, so reusing the name would mean falling back
# to it whenever the environment secret is absent — and a preview key makes
# `convex deploy` build a PREVIEW deployment, which the verifier would then
# verify, reporting success while production went untouched.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full 40-character commit SHA — must be main's current tip"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY TO PRODUCTION exactly"
        required: true
        type: string

# Least privilege by default; the one job that needs more asks for it.
permissions:
  contents: read

# Never two production deploys at once, and never cancel one midway — an
# interrupted `convex deploy` is a worse state than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Decide, while there is still nothing to steal ──────────────────────
  #
  # No `environment:`, so this job cannot reach the production credentials at
  # all — the refusals below happen before the secrets exist in the run.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      main_tip: ${{ steps.check.outputs.main_tip }}
    steps:
      # `github.ref` — pinned to main by the script — NOT the commit under
      # judgement, so a commit cannot ship its own approval logic.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'

      # No `pnpm install` on purpose: this imports one dependency-free module
      # and talks to the GitHub API over `fetch`. Nothing from the candidate
      # commit is fetched, installed, built or executed here.
      - name: Verify the commit may reach production
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INPUT_SHA: ${{ inputs.commit_sha }}
          RELEASE_INPUT_CONFIRM: ${{ inputs.confirm }}
        run: node scripts/checkReleaseAuthority.mjs

  # ── 2. Deploy, then finish the rollout in the same job ────────────────────
  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    # The binding control. Secrets below are unreachable until a human approves
    # this specific run against this specific commit.
    environment: production
    timeout-minutes: 90
    # Read-only, and enough to re-derive the CI verdict after approval.
    permissions:
      checks: read
      contents: read
      statuses: read
    steps:
      - name: Check out the authorised commit exactly
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A SHA, never a branch name — a mutable ref would reintroduce
          # everything the `authorize` job just ruled out.
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Assert the checkout is that commit
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but $EXPECTED_SHA was authorised."
            exit 1
          fi
          echo "HEAD is $actual"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      # Frozen, and matching what CI installs everywhere else in this repo, so
      # the tree that deploys is the tree the tests ran against.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ⚠️ Re-derived HERE, in the workflow definition, rather than trusted from
      # the `authorize` job, and placed AFTER installation so the last thing
      # before `convex deploy` is a fresh answer. Approval is asynchronous — a
      # run can wait hours — and without this a deploy authorised against
      # yesterday's tip ships today, silently reverting everything merged in
      # between while the summary claims it is shipping "main's current tip".
      #
      # It is not affected by the checkout above either, so it cannot be swapped
      # by choosing a different target commit.
      - name: Independently re-verify main's tip immediately before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::error::main is now at $tip, not $EXPECTED_SHA. Dispatch a new run against the current tip."
            exit 1
          fi
          echo "main is still at $tip"

      # ⚠️ CI is re-derived here too, and for a reason the tip check above does
      # NOT cover: a check can be re-run red, a workflow removed, or a waiver
      # expire at midnight, without `main` moving at all. Without this, "CI is
      # green at that exact commit" was proven before the approval wait and
      # reported after it.
      #
      # Runs from the candidate commit's checkout, which is only sound because
      # the step above has just proven the candidate IS main's tip. Do not
      # reorder these two.
      - name: Re-verify CI at that commit, now that it has been approved
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/assertReleaseChecks.mjs

      # ⚠️ "Is it a production key" is not the question. A valid production key
      # for the WRONG project deploys, verifies and reports success there just
      # as confidently — and 2026-08-07 was a targeting error, not an
      # authorisation one. Both keys must name the deployment this repository
      # expects, and must agree with each other.
      - name: Refuse credentials that do not address the expected deployment
        env:
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          CONVEX_PROD_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          CONVEX_PROD_OPERATOR_KEY: ${{ secrets.CONVEX_PROD_OPERATOR_KEY }}
        run: node scripts/assertReleaseCredentials.mjs

      # `pnpm exec` resolves the Convex CLI from this commit's own
      # `node_modules`. Never `npx`, which is free to download a different
      # version; never `--cmd`, which would run an arbitrary command inside the
      # deploy; never `-y`, which is what suppressed the confirmation on
      # 2026-08-07 and is undocumented in `--help`.
      #
      # ⚠️ Its output goes to the job log, which on a public repository is
      # public. An earlier revision `tee`'d it to a file and then added a step
      # announcing the file was not uploaded as an artifact — which reduced
      # nothing, because `tee` had already streamed the same bytes somewhere
      # equally public. The file is gone; the honest statement is that anything
      # `convex deploy` prints is published.
      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
        run: pnpm exec convex deploy

      # Same job, immediately after the deploy, because the window between them
      # is the expensive one: the conversation trigger is live and adding writes
      # while every inbox is still served by the legacy full scan.
      #
      # This step is given ONLY the operator key. Whether that key can deploy is
      # decided by how narrowly it was minted — Convex enforces key scope
      # server-side and nothing here can verify it. See AGENTS.md: if the
      # dashboard cannot mint a `runInternalMutations`/`runInternalQueries`-only
      # key, this separation is organisational, not structural.
      - name: Roll out Social Inbox conversations and verify
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_OPERATOR_KEY }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          ROLLOUT_TIMEOUT_MINUTES: '45'
        run: node scripts/rolloutRelease.mjs
