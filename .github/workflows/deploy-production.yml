
# Production Convex deploys, and the rollout that has to follow one.
#
# This exists because a wrapper on a developer's machine could not be made
# binding. `npx convex deploy` still worked next to it, the production
# credential sat on the workstation, and two rounds of review kept finding ways
# out of the sandbox it claimed to be. The boundary has to be somewhere the
# operator is not.
#
# So: the credential lives only in this repository's `production` environment, a
# human other than the requester approves each run, and the whole thing is
# ordered so that verification happens while there is still nothing to steal.
#
# ⚠️ There is deliberately NO rollback mode. Any rollback target predates this
# verification tooling, so the run would deploy and then verify nothing while
# reporting success. Undo by merging a revert and deploying it through this same
# path, with the full checks. Versioned rollback compatibility is separate work.
#
# ⚠️ Requires configuration that is NOT in this file, and the workflow is NOT a
# boundary until it exists — see AGENTS.md:
#   · the `production` environment given a REQUIRED REVIEWER, self-review
#     prevented, admin bypass disabled, and deployment branches restricted to
#     `main`. An environment with no protection rules gates NOTHING:
#     `environment:` on a rule-less environment is a no-op and the job starts
#     immediately, like any other.
#   · `CONVEX_PROD_DEPLOYMENT`     — environment VARIABLE (not a secret), the
#                                    exact production deployment name
#   · `CONVEX_PROD_DEPLOY_KEY`     — environment secret, `deployment:deploy` only
#   · `CONVEX_PROD_OPERATOR_KEY`   — environment secret, `runInternalMutations`
#                                    + `runInternalQueries` only
#   · the workstation production deploy key REVOKED once this is proven
#
# SCRUM-1026 — optional SELF-HOSTED target. Unset, nothing changes. To use it,
# in the same `production` environment:
#   · `CONVEX_PROD_TARGET`                — environment VARIABLE: `self-hosted`
#                                           (unset or `cloud` = Convex Cloud;
#                                           any other value refuses)
#   · `CONVEX_PROD_DEPLOYMENT`            — the backend's INSTANCE_NAME
#   · `CONVEX_PROD_SELF_HOSTED_URL`       — environment VARIABLE: bare https
#                                           origin of the backend, on your own
#                                           DNS name (not *.convex.cloud/.site),
#                                           written exactly as the URL parser
#                                           would print it: lowercase, no port
#                                           (`:443` is refused), at most one
#                                           trailing `/`, nothing else
#   · `CONVEX_PROD_SELF_HOSTED_ADMIN_KEY` — environment secret, `<instance>|<token>`
# Truthful limits: a self-hosted backend has ONE admin key with full power, so
# deploy / operator / observer separation does not exist on that target; and the
# instance name is self-declared by the backend, so matching it is a targeting
# check, not authentication. The cloud keys must NOT be placed in any
# self-hosted step, and the self-hosted URL/key must not be configured while the
# target is cloud. What enforces each, exactly: the self-hosted credential gate,
# zero-state check and rollout refuse a cloud-pointing variable in their own
# environment (`assertSelfHostedCliEnv`), the self-hosted deploy step runs that
# same check itself before the Convex CLI, and the cloud gate refuses any
# self-hosted variable. The Convex CLI is NOT one of the enforcers: it prefers a
# deploy key over the self-hosted pair without complaint and refuses only
# CONVEX_DEPLOYMENT set together with that pair. The workflow's structure test
# and hash pin keep a cloud key out of the self-hosted steps' `env:`.
#
# ⚠️ The secret names are deliberately NOT `CONVEX_DEPLOY_KEY`. A repository
# secret of that name exists and is consumed by `playwright.yml`. Repository
# secrets are visible to every job, so reusing the name would mean falling back
# to it whenever the environment secret is absent — and a preview key makes
# `convex deploy` build a PREVIEW deployment, which the verifier would then
# verify, reporting success while production went untouched.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full 40-character commit SHA — must be main's current tip"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY TO PRODUCTION exactly"
        required: true
        type: string
      # ⚠️ ONE-TIME LAUNCH CHECKPOINT, opt-in. Set to `fresh-launch` ONLY for
      # the first deploy to a brand-new, empty production deployment
      # (SCRUM-231 / SCRUM-313 B4). It reads every table, every component and
      # the file store AFTER the push and BEFORE the rollout step, and stops the
      # run unless they are empty. An established dealership's deployment is
      # SUPPOSED to hold data, so the default never runs it — do not turn this
      # into a standing release gate.
      zero_state:
        description: "Zero-state checkpoint: `not-required` (default) or `fresh-launch` (first deploy to an EMPTY deployment only)"
        required: false
        default: "not-required"
        type: choice
        options:
          - not-required
          - fresh-launch

# Least privilege by default; the one job that needs more asks for it.
permissions:
  contents: read

# Never two production deploys at once, and never cancel one midway — an
# interrupted `convex deploy` is a worse state than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Decide, while there is still nothing to steal ──────────────────────
  #
  # No `environment:`, so this job cannot reach the production credentials at
  # all — the refusals below happen before the secrets exist in the run.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      main_tip: ${{ steps.check.outputs.main_tip }}
    steps:
      # `github.ref` — pinned to main by the script — NOT the commit under
      # judgement, so a commit cannot ship its own approval logic.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'

      # No `pnpm install` on purpose: this imports one dependency-free module
      # and talks to the GitHub API over `fetch`. Nothing from the candidate
      # commit is fetched, installed, built or executed here.
      - name: Verify the commit may reach production
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INPUT_SHA: ${{ inputs.commit_sha }}
          RELEASE_INPUT_CONFIRM: ${{ inputs.confirm }}
        run: node scripts/checkReleaseAuthority.mjs

  # ── 2. Deploy, then finish the rollout in the same job ────────────────────
  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    # The binding control. Secrets below are unreachable until a human approves
    # this specific run against this specific commit.
    environment: production
    timeout-minutes: 90
    # Read-only, and enough to re-derive the CI verdict after approval.
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - name: Check out the authorised commit exactly
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A SHA, never a branch name — a mutable ref would reintroduce
          # everything the `authorize` job just ruled out.
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Assert the checkout is that commit
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but $EXPECTED_SHA was authorised."
            exit 1
          fi
          echo "HEAD is $actual"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'

      # Frozen, and matching what CI installs everywhere else in this repo, so
      # the tree that deploys is the tree the tests ran against.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ⚠️ Re-derived HERE, in the workflow definition, rather than trusted from
      # the `authorize` job, and placed AFTER installation so the last thing
      # before `convex deploy` is a fresh answer. Approval is asynchronous — a
      # run can wait hours — and without this a deploy authorised against
      # yesterday's tip ships today, silently reverting everything merged in
      # between while the summary claims it is shipping "main's current tip".
      #
      # It is not affected by the checkout above either, so it cannot be swapped
      # by choosing a different target commit.
      - name: Independently re-verify main's tip immediately before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::error::main is now at $tip, not $EXPECTED_SHA. Dispatch a new run against the current tip."
            exit 1
          fi
          echo "main is still at $tip"

      # ⚠️ CI is re-derived here too, and for a reason the tip check above does
      # NOT cover: a check can be re-run red, a workflow removed, or a waiver
      # expire at midnight, without `main` moving at all. Without this, "CI is
      # green at that exact commit" was proven before the approval wait and
      # reported after it.
      #
      # Runs from the candidate commit's checkout, which is only sound because
      # the step above has just proven the candidate IS main's tip. Do not
      # reorder these two.
      - name: Re-verify CI at that commit, now that it has been approved
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/assertReleaseChecks.mjs

      # SCRUM-1026: which backend this run addresses. ONE non-secret variable,
      # `CONVEX_PROD_TARGET`: unset/empty or `cloud` is today's Convex Cloud
      # path, `self-hosted` selects the self-hosted path, anything else stops the
      # run here. Every gate above (authority, exact SHA, main tip, CI at that
      # commit, environment approval) applies to both targets and is not
      # conditional. The cloud steps below run unless the output is exactly
      # `self-hosted`, so a missing output can only reach the path whose own gate
      # refuses mixed configuration — never a deploy with no identity check.
      - name: Select the deploy target
        id: target
        env:
          CONVEX_PROD_TARGET: ${{ vars.CONVEX_PROD_TARGET }}
        run: node scripts/resolveReleaseTarget.mjs

      # ⚠️ "Is it a production key" is not the question. A valid production key
      # for the WRONG project deploys, verifies and reports success there just
      # as confidently — and 2026-08-07 was a targeting error, not an
      # authorisation one. Both keys must name the deployment this repository
      # expects, and must agree with each other.
      #
      # SCRUM-1026: this step is the CLOUD variant. It also refuses a MIXED
      # configuration — the target variable saying `self-hosted`, or any
      # self-hosted URL or key being configured — and is handed only a boolean
      # for the self-hosted key, never the key.
      - name: Refuse credentials that do not address the expected deployment
        if: ${{ steps.target.outputs.target != 'self-hosted' }}
        env:
          CONVEX_PROD_TARGET: ${{ vars.CONVEX_PROD_TARGET }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          CONVEX_PROD_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          CONVEX_PROD_OPERATOR_KEY: ${{ secrets.CONVEX_PROD_OPERATOR_KEY }}
          CONVEX_PROD_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_SELF_HOSTED_URL }}
          CONVEX_PROD_SELF_HOSTED_ADMIN_KEY_PRESENT: ${{ secrets.CONVEX_PROD_SELF_HOSTED_ADMIN_KEY != '' }}
        run: node scripts/assertReleaseCredentials.mjs

      # SELF-HOSTED variant of the gate above. Holds the one self-hosted admin
      # key and NO Convex Cloud credential. Offline checks (target, URL shape,
      # key shape, key's instance name == CONVEX_PROD_DEPLOYMENT) run before the
      # one network call: an unauthenticated GET of `<url>/instance_name`, which
      # must answer 200, with no redirect followed, and the same name.
      - name: Refuse self-hosted credentials and backend that do not address the expected instance
        if: ${{ steps.target.outputs.target == 'self-hosted' }}
        env:
          CONVEX_PROD_TARGET: ${{ vars.CONVEX_PROD_TARGET }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          CONVEX_PROD_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_SELF_HOSTED_URL }}
          CONVEX_PROD_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PROD_SELF_HOSTED_ADMIN_KEY }}
        run: node scripts/assertReleaseCredentials.mjs

      # `pnpm exec` resolves the Convex CLI from this commit's own
      # `node_modules`. Never `npx`, which is free to download a different
      # version; never `--cmd`, which would run an arbitrary command inside the
      # deploy; never `-y`, which is what suppressed the confirmation on
      # 2026-08-07 and is undocumented in `--help`.
      #
      # ⚠️ Its output goes to the job log, which on a public repository is
      # public. An earlier revision `tee`'d it to a file and then added a step
      # announcing the file was not uploaded as an artifact — which reduced
      # nothing, because `tee` had already streamed the same bytes somewhere
      # equally public. The file is gone; the honest statement is that anything
      # `convex deploy` prints is published.
      #
      # ⚠️ The tip is checked ONE LAST TIME inside this step, on the line before
      # the deploy. The earlier check has to happen where it does — the CI
      # re-verification below it runs the candidate's own copy of that logic and
      # is only sound once the candidate is known to be main's tip — but that
      # left credential assertion and this step between the check and the deploy,
      # and a merge landing in that gap ships a commit that is no longer the tip.
      #
      # This does not close the window; nothing can. A merge can land in the
      # microsecond after any check. It reduces it from "several steps" to "one
      # command", which is the honest limit, and AGENTS.md states the guarantee
      # as observed-immediately-before rather than as absolute.
      - name: Deploy Convex backend
        if: ${{ steps.target.outputs.target != 'self-hosted' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced to $tip while this run waited. Nothing has been deployed."
            exit 1
          fi
          pnpm exec convex deploy

      # SELF-HOSTED variant of the deploy above: the same last-moment tip check
      # and the same command. The Convex CLI is pointed ONLY by the
      # CONVEX_SELF_HOSTED_URL / CONVEX_SELF_HOSTED_ADMIN_KEY pair; no Convex
      # Cloud variable (CONVEX_DEPLOY_KEY, CONVEX_DEPLOYMENT_TOKEN,
      # CONVEX_DEPLOYMENT, CONVEX_PREVIEW_DEPLOY_KEY) is in this step's `env:`.
      #
      # ⚠️ The CLI does NOT keep the two families apart. In convex 1.42.1 it
      # reads a deploy key (CONVEX_DEPLOY_KEY, else CONVEX_DEPLOYMENT_TOKEN)
      # first and deploys to Convex Cloud without looking at the self-hosted
      # pair; it refuses only CONVEX_DEPLOYMENT set together with that pair.
      # What keeps a cloud key out of this step is: the structure test and the
      # workflow hash pin (so none is added to this step's `env:`), and
      # `scripts/assertSelfHostedDeployEnv.mjs`, run FIRST below, which refuses
      # (and then nothing is deployed) if any cloud-pointing variable is present
      # in the step's real environment or the URL is not the canonical origin.
      #
      # ⚠️ ONE admin key with full power is all this target has. The cloud path's
      # deploy / operator / observer credential separation does not exist here.
      - name: Deploy Convex backend (self-hosted)
        if: ${{ steps.target.outputs.target == 'self-hosted' }}
        env:
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PROD_SELF_HOSTED_ADMIN_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/assertSelfHostedDeployEnv.mjs
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced to $tip while this run waited. Nothing has been deployed."
            exit 1
          fi
          pnpm exec convex deploy

      # ── Zero-state checkpoint (fresh launch only) ─────────────────────────
      #
      # READ-ONLY COMMANDS / WRITE-CAPABLE CREDENTIAL. Runs after the push and
      # before the rollout step — i.e. before anything is written on behalf of
      # an organization — and refuses the run unless every table the deployment
      # lists, every mounted component's tables and the file store are empty,
      # functions exist, the schema's tables are all present, the deployment
      # answers to the expected name, and it carries no E2E preview marker.
      #
      # The credential is the observer key, injected into THIS step only. Its
      # name does not narrow it: Convex mints full deploy keys, so it could
      # deploy. What bounds it is this protected job (main tip, exact SHA,
      # environment approval), the target check (the key must address
      # `CONVEX_PROD_DEPLOYMENT`), the fixed read-only command set in
      # `scripts/verifyZeroState.mjs`, and a log that carries table names and
      # counts only. No PR job, no repository fallback, no artifact.
      #
      # A failed verdict STOPS the run. Nothing here resets, imports or retries.
      - name: Verify zero-state (fresh launch checkpoint)
        if: ${{ inputs.zero_state == 'fresh-launch' && steps.target.outputs.target != 'self-hosted' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_FRESH_OBSERVER_KEY }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/verifyZeroState.mjs --phase post-deploy

      # SELF-HOSTED variant: the same assertions through the same script. The
      # only credential is the one admin key; the script re-validates the URL,
      # the key's instance name and the backend's own /instance_name answer, and
      # refuses (never skips) when any identity read-back is missing.
      - name: Verify zero-state (fresh launch checkpoint, self-hosted)
        if: ${{ inputs.zero_state == 'fresh-launch' && steps.target.outputs.target == 'self-hosted' }}
        env:
          CONVEX_PROD_TARGET: ${{ vars.CONVEX_PROD_TARGET }}
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PROD_SELF_HOSTED_ADMIN_KEY }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/verifyZeroState.mjs --phase post-deploy

      # Same job, immediately after the deploy, because the window between them
      # is the expensive one: the conversation trigger is live and adding writes
      # while every inbox is still served by the legacy full scan.
      #
      # This step is given ONLY the operator key. Whether that key can deploy is
      # decided by how narrowly it was minted — Convex enforces key scope
      # server-side and nothing here can verify it. See AGENTS.md: if the
      # dashboard cannot mint a `runInternalMutations`/`runInternalQueries`-only
      # key, this separation is organisational, not structural.
      - name: Roll out Social Inbox conversations and verify
        if: ${{ steps.target.outputs.target != 'self-hosted' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_OPERATOR_KEY }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          ROLLOUT_TIMEOUT_MINUTES: '45'
        run: node scripts/rolloutRelease.mjs

      # SELF-HOSTED variant: the same script and the same assertions. It holds
      # the one admin key (there is no narrower operator credential on this
      # target), and the backend's own `CONVEX_CLOUD_URL` must equal the
      # configured origin — set the backend's CONVEX_CLOUD_ORIGIN to that URL or
      # this step refuses.
      - name: Roll out Social Inbox conversations and verify (self-hosted)
        if: ${{ steps.target.outputs.target == 'self-hosted' }}
        env:
          CONVEX_PROD_TARGET: ${{ vars.CONVEX_PROD_TARGET }}
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PROD_SELF_HOSTED_ADMIN_KEY }}
          CONVEX_PROD_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          ROLLOUT_TIMEOUT_MINUTES: '45'
        run: node scripts/rolloutRelease.mjs
