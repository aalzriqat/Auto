name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


# Least-privilege default for every job here: this workflow only reads the
# repository. Without an explicit block, jobs inherit the repository-wide
# default token scope, which is broader than anything below needs.
permissions:
  contents: read

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # Only the repo-wide report, which is what the artifact below uploads.
    # `test:coverage:sonar` used to run here too, back when it wrote to the same
    # coverage/ directory and so changed what got uploaded. It writes to
    # coverage-sonar/ now, and nothing in this job reads that — it was ~2 minutes
    # of dead work on every PR, in a required check. The sonarcloud job below
    # generates its own reports.
    - name: Run unit + integration tests with coverage
      run: pnpm test:coverage
      env:
        NODE_ENV: test

    - name: Upload coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

    - name: Coverage summary
      run: |
        if [ -f coverage/coverage-summary.json ]; then
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const fmt = (v) => v.pct.toFixed(1) + '%';
            console.log('| Metric | Coverage |');
            console.log('|--------|----------|');
            console.log('| Lines | ' + fmt(s.lines) + ' |');
            console.log('| Functions | ' + fmt(s.functions) + ' |');
            console.log('| Branches | ' + fmt(s.branches) + ' |');
            console.log('| Statements | ' + fmt(s.statements) + ' |');
          " >> $GITHUB_STEP_SUMMARY
        fi
      if: always()

  # SonarCloud currently analyses this repo in Automatic Analysis mode, which
  # does NOT read sonar-project.properties — so every exclusion in that file is
  # dead config. That is why `load-tests/**` is still analysed and still
  # contributes vulnerabilities to the Security Rating gate,
  # and why `sonar.javascript.lcov.reportPaths` has never actually delivered a
  # coverage report.
  #
  # This job runs the scanner from CI, which makes that file authoritative. It
  # activates the moment a SONAR_TOKEN repo secret exists and is skipped
  # otherwise, so merging it changes nothing until the token is added.
  #
  # ORDERING IS MANDATORY, not advisory: SonarCloud REJECTS a CI submission while
  # Automatic Analysis is enabled ("You are running CI analysis while Automatic
  # Analysis is enabled") and the scanner exits non-zero. So switch Automatic
  # Analysis off in the SonarCloud UI in the same sitting as adding the token, or
  # this job goes red on every push in between. It is not a required check, so it
  # will not block a merge either way.
  sonarcloud:
    runs-on: ubuntu-latest
    # Forked PRs get no secrets, so the scan would always be a no-op there.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Job-level so the scan step's own `if` can read it — a step cannot see the
    # `env` block declared on itself.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
        # Sonar needs full history to attribute new code to the right commits.
        fetch-depth: 0

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # Two coverage reports feed Sonar (SCRUM-185):
    #
    #   coverage-sonar/lcov.info             every production module under convex/
    #   apps/mobile/coverage-sonar/lcov.info  every production module in the mobile app
    #
    # Both are generated here, in this job, so they are guaranteed to describe the
    # same commit the scanner analyses. The mobile suite costs about 50s, which is
    # not worth an artifact handoff between jobs and the skew risk that carries.
    - name: Generate Convex coverage for Sonar
      run: pnpm test:coverage:sonar
      env:
        NODE_ENV: test

    # Only a SUCCESSFUL run produces a report Sonar is allowed to read.
    #
    # An earlier version of this step carried `continue-on-error`, on the argument
    # that a partial report can only understate coverage and so only pushes the
    # gate toward red. That argument is wrong, because it quietly assumes the
    # leftover report is merely incomplete rather than misshapen: a jest run that
    # died partway leaves a file that still parses, still lists source records,
    # and still passes every structural check below, while describing a run that
    # never finished. "It looks valid" is not "it is a successful measurement".
    #
    # So a failure discards its own output and is retried exactly once — which
    # covers the flake this is actually exposed to — and a second failure stops
    # the job before the scan. That does mean the required Sonar context goes
    # ABSENT rather than red in that case (SCRUM-186); an absent gate that blocks
    # the merge is the correct outcome when the evidence could not be produced.
    #
    # The mobile suite's real test gate is `pnpm mobile:test` in the
    # mobile-and-shared job, a required check enforcing 100% over its curated set.
    # Nothing here weakens or substitutes for it.
    - name: Generate mobile coverage for Sonar
      run: |
        rm -rf apps/mobile/coverage-sonar
        if pnpm mobile:test:coverage:sonar; then
          exit 0
        fi
        echo "::warning::mobile coverage run failed — discarding its output and retrying once so a half-written report cannot be scanned"
        rm -rf apps/mobile/coverage-sonar
        pnpm mobile:test:coverage:sonar
      env:
        NODE_ENV: test

    # jest writes SF: paths relative to its own rootDir, which is apps/mobile —
    # so the mobile report says `SF:src/features/...`. Sonar resolves coverage
    # paths against the PROJECT base directory, the repository root, where no
    # `src/` exists. Left alone the whole mobile report resolves to nothing, and
    # it does so SILENTLY: the scan still succeeds, the files just stay uncovered,
    # which is indistinguishable from having no tests. The convex report does not
    # need this — vitest already runs at the repository root, so its paths read
    # `SF:convex/...` and resolve as-is.
    - name: Rebase mobile coverage paths onto the repository root
      run: |
        sed -i 's|^SF:|SF:apps/mobile/|' apps/mobile/coverage-sonar/lcov.info
        echo "rewrote $(grep -c '^SF:' apps/mobile/coverage-sonar/lcov.info) source paths"

    # Sonar does NOT fail when a coverage report is missing or unresolvable. It
    # analyses with no coverage data and reports 0.0% coverage on 0.0% of new
    # code, which the Quality Gate PASSES. That vacuous green is the defect this
    # ticket exists to remove, so the scan is not allowed to start until both
    # reports exist AND their records point at files that are really there.
    #
    # Counting records is not enough on its own: a report full of paths that
    # resolve to nothing has plenty of records and still measures nothing. That
    # is exactly the failure the rewrite above prevents, so this is the check
    # that would have caught it.
    - name: Verify both coverage reports are real before scanning
      run: |
        fail=0
        for report in coverage-sonar/lcov.info apps/mobile/coverage-sonar/lcov.info; do
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty. Refusing to scan: Sonar would report 0.0% coverage on 0.0% of new code and PASS the gate on no evidence."
            fail=1
            continue
          fi
          records=$(grep -c '^SF:' "$report" || true)
          if [ "$records" -lt 1 ]; then
            echo "::error::$report contains no SF: source records. Refusing to scan on an empty report."
            fail=1
            continue
          fi
          missing=0
          while IFS= read -r path; do
            [ -f "$path" ] || missing=$((missing + 1))
          done < <(grep '^SF:' "$report" | sed 's|^SF:||')
          if [ "$missing" -gt 0 ]; then
            echo "::error::$report has $missing of $records source paths that do not exist at the repository root. Sonar would silently ignore them and measure less than it appears to."
            fail=1
            continue
          fi
          echo "$report: $records source records, all resolving to real files"
        done
        exit $fail

    - name: SonarCloud scan
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

    - name: Note when the scan is skipped
      if: ${{ env.SONAR_TOKEN == '' }}
      run: echo "::notice::SONAR_TOKEN is not set — skipping the SonarCloud scan. Until it is, SonarCloud analyses this repo in Automatic Analysis mode, which ignores sonar-project.properties."

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: TypeScript type check
      run: pnpm typecheck

  # `pnpm build` ran nowhere in this workflow until now. It happens inside
  # playwright.yml (via playwright.config.ts's webServer) and twice more in
  # security.yml's zap-baseline/nuclei jobs — but none of those is a required
  # check, so a branch that type-checks and passes every test while failing
  # `next build` could merge.
  #
  # `pnpm typecheck` does not cover this. Demonstrated, not assumed: a client
  # component importing a Node built-in (`fs`) passes `tsc --noEmit`, which
  # resolves it happily via @types/node, and fails the build, which has to
  # produce a browser bundle — `Module not found: Can't resolve 'fs'`. On one
  # commit, type-check green and production-build red (throwaway PR #209).
  #
  # Note what was NOT demonstrated: declaring a dynamic route's `params` as a
  # plain object rather than a Promise also passes typecheck, but Next 16's
  # generated `.next/types` did not reject it, so the build stayed green. The
  # gate's value here is bundler-level module resolution, not route-type
  # checking — don't widen that claim without re-testing it.
  #
  # It gets its own named job rather than leaning on Playwright's build because
  # "does the application compile?" and "do the E2E flows pass?" are different
  # questions with different failure modes and very different flake profiles.
  # A build break should surface as a red `production-build`, not as an
  # ambiguous E2E timeout.
  #
  # Env: deliberately placeholders, not repo secrets. lib/env.ts validates shape
  # only (zod .url() / .min(1)) and throws on failure, so shape-valid dummies
  # exercise exactly the same build path — while keeping this job working on
  # forked PRs, which receive no secrets and would otherwise fail this required
  # check permanently and unfixably. CLERK_SECRET_KEY is omitted entirely: it is
  # .optional() in lib/env.ts and no route is statically prerendered, so the
  # build never needs it, and `next build` runs arbitrary dependency code with
  # the full job environment in process.env on a public repo.
  #
  # Two maintenance couplings this creates, both of which fail here rather than
  # where the change was made:
  #   - adding a *required* var to lib/env.ts turns this job red with only zod's
  #     "Invalid environment variables" to explain it. Add the placeholder here
  #     in the same commit.
  #   - dropping CLERK_SECRET_KEY is safe only while nothing is statically
  #     prerendered, and what guarantees that is the `await headers()` call in
  #     app/layout.tsx. Remove that and prerendering resumes.
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # The Clerk placeholder is assembled here rather than written as a literal:
    # a publishable key is base64 of a hostname, so its entropy is high enough
    # that gitleaks' generic-api-key rule fires on it (it did — secret-scan, a
    # required check, went red on the commit that first added it). Building it
    # at runtime keeps the scanner at full strength instead of allowlisting a
    # pattern in .gitleaks.toml. It decodes to
    # "ci-placeholder.clerk.accounts.dev$" — a well-formed key for an instance
    # that does not exist, and publishable by definition.
    # The length assertion is not decoration. `export VAR="$(cmd)"` takes the
    # exit status of `export`, not of the substitution, so `bash -e` cannot see
    # a failed `base64` — the value would silently become the bare "pk_test_"
    # prefix, which still satisfies lib/env.ts's .min(1) and would build green
    # against a malformed key. `base64 -w0` is GNU coreutils and present on
    # ubuntu-latest, so this is latent rather than live, but a container image
    # with busybox base64 (no -w flag) would trip it. Fail loudly instead.
    - name: Production build
      run: |
        set -euo pipefail
        key="pk_test_$(printf '%s' 'ci-placeholder.clerk.accounts.dev$' | base64 -w0 | tr -d '=')"
        [ ${#key} -gt 40 ] || { echo "::error::Clerk placeholder assembly failed"; exit 1; }
        export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$key"
        pnpm build
      env:
        NEXT_TELEMETRY_DISABLED: '1'
        NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
        NEXT_PUBLIC_APP_URL: http://localhost:3000

  convex-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # `convex codegen` requires a configured deployment since Convex 1.42;
    # CONVEX_AGENT_MODE=anonymous runs a throwaway local backend so CI needs
    # no cloud credentials. `dev --once` pushes the code (full schema/function
    # validation) and regenerates convex/_generated for the freshness check.
    # auth.config.ts reads CLERK_JWT_ISSUER_DOMAIN and CLERK_DEV_JWT_ISSUER_DOMAIN
    # from the deployment's env, and `convex env set` refuses to run before a
    # deployment exists — so the first `dev --once` only bootstraps the
    # anonymous deployment (its push is allowed to fail on the missing env
    # vars), then both vars are set and the real validation pass runs.
    - name: Generate Convex bindings and validate backend types
      run: |
        pnpm exec convex dev --once --typecheck disable || true
        pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN https://ci-placeholder.clerk.accounts.dev
        pnpm exec convex env set CLERK_DEV_JWT_ISSUER_DOMAIN https://ci-placeholder-dev.clerk.accounts.dev
        pnpm exec convex dev --once --typecheck enable
      env:
        CONVEX_AGENT_MODE: anonymous

    - name: Verify generated Convex files are committed
      run: git diff --exit-code convex/_generated

    - name: Convex tsconfig type check
      run: pnpm typecheck:convex

  # apps/** and packages/** are excluded from the root lint, typecheck and
  # vitest runs (see vitest.config.ts / eslint.config.mjs), and until now no
  # workflow ran their own scripts either — so the mobile app's 100% coverage
  # gate had never executed once, and a mobile screen calling a backend function
  # that does not exist compiled, shipped, and failed on a user's phone. These
  # scripts already existed; nothing invoked them.
  mobile-and-shared:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # Runs before the app checks: packages/shared is what apps/mobile builds on.
    - name: Shared package type check
      run: pnpm shared:typecheck

    - name: Shared package tests
      run: pnpm shared:test

    - name: Mobile type check
      run: pnpm mobile:typecheck

    - name: Mobile tests
      run: pnpm mobile:test

  dealer-worker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'npm'
        cache-dependency-path: dealer-worker/package-lock.json

    - name: Install worker dependencies
      run: npm ci --prefix dealer-worker --ignore-scripts

    - name: Worker type check
      run: npm run --prefix dealer-worker typecheck

    - name: Worker tests
      run: npm run --prefix dealer-worker test

    - name: Worker dry-run build
      run: npm run --prefix dealer-worker build

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Lint
      run: pnpm lint

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.13.0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.21.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Root dependency audit
      run: pnpm audit --audit-level high --ignore-registry-errors

    - name: Install worker dependencies
      run: npm ci --prefix dealer-worker --ignore-scripts

    - name: Worker dependency audit
      run: |
        set +e
        audit_output="$(npm audit --prefix dealer-worker --audit-level high 2>&1)"
        audit_status=$?
        set -e
        printf '%s\n' "$audit_output"
        if [ "$audit_status" -eq 0 ]; then
          exit 0
        fi
        if printf '%s\n' "$audit_output" | grep -Eiq 'audit endpoint|registry error|ECONNRESET|EAI_AGAIN|ETIMEDOUT|ESOCKETTIMEDOUT|socket hang up|502|503|504'; then
          echo "Ignoring transient npm audit registry failure for dealer-worker."
          exit 0
        fi
        exit "$audit_status"

    - name: Audit summary
      if: always()
      run: |
        echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
        echo "### Root" >> $GITHUB_STEP_SUMMARY
        pnpm audit --audit-level high --ignore-registry-errors >> $GITHUB_STEP_SUMMARY 2>&1 || true
        echo "### Dealer worker" >> $GITHUB_STEP_SUMMARY
        npm audit --prefix dealer-worker --audit-level high >> $GITHUB_STEP_SUMMARY 2>&1 || true

  secret-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Secret scan
      uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
