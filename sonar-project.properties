sonar.projectKey=aalzriqat_Auto
sonar.organization=aalzriqat

# Two reports, and only the two this job actually produces (SCRUM-185).
#
#   coverage-sonar/lcov.info              every production module under convex/
#                                         and scripts/
#   apps/mobile/coverage-sonar/lcov.info  every production module in the mobile app
#
# `coverage/lcov.info` was listed here too and has been removed, because the
# `sonarcloud` job never creates it: it runs the rule-based report, not
# `pnpm test:coverage`, and it does not download the unit job's artifact. Sonar
# treats a listed-but-absent path as nothing-to-ingest rather than an error, so
# the entry was silent decoration — a configuration that claimed three reports
# and delivered two. If that artifact is ever wired into this job, re-add it here
# in the same change, not before.
#
# The two that remain used to be one, and it was worse than it sounds. Both
# vitest runs wrote to coverage/, so the second destroyed the first and Sonar
# only ever saw whichever finished last. And the mobile report had never been
# delivered at all: Sonar counts apps/mobile/** as production code —
# `sonar.coverage.exclusions` below excludes `app/**`, the Next.js directory, but
# NOT `apps/**`, the React Native app; the two names differ by one character and
# mean different trees — yet no mobile LCOV was ever listed. So every mobile
# production file sat in the coverage denominator with nothing in the numerator,
# and any PR touching one inherited 0% coverage on new code however well tested
# it was. PR #239 is the one that hit it.
sonar.javascript.lcov.reportPaths=coverage-sonar/lcov.info,apps/mobile/coverage-sonar/lcov.info

# coverage-sonar/ and apps/mobile/coverage-sonar/ are excluded from ANALYSIS for
# the same reason coverage/ already is. istanbul's `lcov` reporter is a
# composite: it writes lcov-report/ alongside lcov.info, and that directory
# carries generated third-party JavaScript (prettify.js, sorter.js,
# block-navigation.js) and HTML. Both directories are created inside the
# sonarcloud job moments before the scan, so without this they join the
# analysis surface and contribute issues and duplication of their own — to the
# very gate this ticket exists to make honest.
#
# Excluded from analysis is NOT excluded from being read as coverage: both
# reports stay listed in sonar.javascript.lcov.reportPaths above. main already
# relies on exactly that combination for coverage/lcov.info.
sonar.exclusions=graphify-out/**,.scannerwork/**,sonar-output/**,coverage/**,coverage-sonar/**,apps/mobile/coverage-sonar/**,load-tests/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# Build and test configuration is not production code and no test executes it.
# Sonar was counting `vitest.sonar.config.ts` as new code needing coverage, so
# adding a config file failed the gate on 2 uncovered lines. Excluding those from
# coverage accounting is right; they are still analysed for issues.
#
# WARNING: do not write this as `**/*.config.*`. That was the first fix and it
# was wrong — "ends in .config.ts" is a naming convention, not a statement about
# what a file DOES, and the glob swept up seven modules with real production
# effect (SCRUM-185 review). `next.config.ts` builds the live
# Content-Security-Policy, X-Frame-Options and Permissions-Policy headers.
# `convex/auth.config.ts` decides which JWT issuer domains are trusted, and
# `convex/convex.config.ts` decides which components — including the rate
# limiter — are mounted; both are genuinely MEASURED in the Convex report and
# the glob threw that measurement away. The sentry configs carry `isProd`
# branches controlling what is sampled to a third party, and
# `apps/mobile/app.config.ts` is a function with conditional OTA-update logic.
# Excluding them means a future edit — widening the trusted issuer set, weakening
# a security header — reports as needing ZERO new coverage.
#
# The line is not the filename. It is: does this file execute as part of the
# deployed application or platform, or does it purely configure a dev/CI tool
# that never ships? Only the second kind is listed below, by name, so adding a
# new one is a deliberate act rather than a side effect of what it was called.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,app/**,components/**,dealer-worker/**,hooks/**,lib/**,marketing/**,public/**,eslint.config.mjs,postcss.config.mjs,playwright.config.ts,vitest.config.ts,vitest.sonar.config.ts,packages/shared/vitest.config.ts,apps/mobile/babel.config.js,apps/mobile/metro.config.js,apps/mobile/jest.sonar.config.js
# app/page.tsx, app/privacy/page.tsx, and app/terms/page.tsx each hold a
# mirrored { en: {...}, ar: {...} } content dictionary — same keys, different
# language strings. CPD flags that structural mirroring as duplication even
# though there's no duplicated logic, so these are excluded from the check.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,load-tests/**,graphify-out/**,app/page.tsx,app/privacy/page.tsx,app/terms/page.tsx

# NOTE: none of the settings in this file take effect while SonarCloud runs in
# Automatic Analysis mode — it does not read sonar-project.properties. The
# `sonarcloud` job in .github/workflows/test.yml runs the scanner from CI so
# they do; it needs a SONAR_TOKEN repo secret, and Automatic Analysis must be
# switched off in the SonarCloud UI once it is in place.

# S6505 ("omitting --ignore-scripts allows lifecycle scripts to run during
# package installation") fires on these two steps because they contain the word
# `install`. It is not a package install: `playwright install` downloads the
# browser binaries that the preceding
# `pnpm install --ignore-scripts` deliberately skipped, and the command does
# not accept `--ignore-scripts`. The actual package installs in every workflow
# do pass it. The equivalent finding on `npx eas-cli` is NOT ignored — that one was
# real, and is now fixed at the source: both invocations pass --ignore-scripts
# alongside the version pin (verified: eas-cli 21.4.0 runs with it set).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/playwright.yml
