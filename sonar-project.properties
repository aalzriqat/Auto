sonar.projectKey=aalzriqat_Auto
sonar.organization=aalzriqat

# Two reports, because the detector's tests run in their OWN vitest process.
# Mixing them into the convex run perturbed worker timing enough to surface a
# pre-existing teardown race (EnvironmentTeardownError: closing rpc while
# onUserConsoleLog was pending, from convex-test scheduled functions logging
# after their test ended) — every test passed and vitest still exited 1.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-contract-skew/lcov.info

sonar.exclusions=graphify-out/**,.scannerwork/**,sonar-output/**,coverage/**,load-tests/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,app/**,components/**,dealer-worker/**,hooks/**,lib/**,marketing/**,public/**
# app/page.tsx, app/privacy/page.tsx, and app/terms/page.tsx each hold a
# mirrored { en: {...}, ar: {...} } content dictionary — same keys, different
# language strings. CPD flags that structural mirroring as duplication even
# though there's no duplicated logic, so these are excluded from the check.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,load-tests/**,graphify-out/**,app/page.tsx,app/privacy/page.tsx,app/terms/page.tsx

# NOTE: none of the settings in this file take effect while SonarCloud runs in
# Automatic Analysis mode — it does not read sonar-project.properties. The
# `sonarcloud` job in .github/workflows/test.yml runs the scanner from CI so
# they do; it needs a SONAR_TOKEN repo secret, and Automatic Analysis must be
# switched off in the SonarCloud UI once it is in place.

# S6505 ("omitting --ignore-scripts allows lifecycle scripts to run during
# package installation") fires on these two steps because they contain the word
# `install`. It is not a package install: `playwright install` downloads the
# browser binaries that the preceding
# `pnpm install --ignore-scripts` deliberately skipped, and the command does
# not accept `--ignore-scripts`. The actual package installs in every workflow
# do pass it. The equivalent finding on `npx eas-cli` is NOT ignored — that one was
# real, and is now fixed at the source: both invocations pass --ignore-scripts
# alongside the version pin (verified: eas-cli 21.4.0 runs with it set).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/playwright.yml
