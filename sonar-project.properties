sonar.projectKey=aalzriqat_Auto
sonar.organization=aalzriqat

# SCRUM-128 — main's New Code definition is "previous version": new code
# starts at the first analysis of the current `sonar.projectVersion`, and
# outside Maven/Gradle the Sonar docs require that version to be set
# explicitly. Nothing in this repo set it. Observed live on 2026-09-15
# (api/qualitygates/project_status, branch=main): period mode
# `previous_version`, baseline 2026-07-04T10:44:15Z, previous version
# "not provided"; the latest main analysis reports project version 0.1.0.
# So the gate on main measured everything changed since 2026-07-04 as new.
#
# Setting the version here (a scanner-config-file value, which overrides
# project-level and detected values) opens a new version on the next main
# analysis; new code on main then starts there. Thresholds, exclusions and
# PR analyses (whose new code is the PR diff) are unchanged. Bump this at each
# release cut, never per build.
sonar.projectVersion=0.2.0

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SCRUM-208 c16195 — main code and test code share directories in this repo,
# so the split is made by pattern rather than by tree. `sonar.tests` has to be
# set for that to work: test inclusions only classify files that are inside it.
# Sonar applies the same patterns as source exclusions, so a file matched here
# is not indexed twice. `sonar.sources` was previously unset, and the scanner's
# default for it is already `.` — it is spelled out only because it now has a
# sibling that must agree with it.
#
# test-utils/ is Vitest harness code and is classified as TEST code: it imports
# `vi`, seeds synthetic authority rows, drives real mutations on behalf of test
# files and installs fake timers. It is neither deployable product nor release
# tooling. That is a classification, not a coverage waiver — test code is
# excluded from source metrics because it is not itself the thing being
# measured.
#
# scripts/ is deliberately NOT classified as test code. commitmentWriteGuard.ts
# and its siblings are executable release-authorization tooling: they parse the
# source tree and decide whether commitment-authority writes are compliant.
# They stay main code, they stay measured, and `test:coverage:sonar` now runs
# their tests so the measurement reflects the suite that exercises them.
sonar.sources=.
sonar.tests=.
sonar.exclusions=graphify-out/**,.scannerwork/**,sonar-output/**,coverage/**,load-tests/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,test-utils/**/*.ts,test-utils/**/*.tsx,playwright/**/*.ts,cypress/**/*.ts
# Contract-skew fixtures are compiler INPUT that tests parse, never execute (D-36); issue and duplication analysis still apply.
# proxy.ts (root Next.js proxy/middleware) is runtime web code like app/** and lib/**: the trusted LCOV validator only admits convex/, scripts/, apps/mobile and packages/shared sources, so it cannot be measured here. Its fail-closed path is still exercised by scripts/intelligence/proxyClerkHandler.test.ts. SCRUM-784.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,app/**,components/**,dealer-worker/**,hooks/**,lib/**,marketing/**,public/**,scripts/contractSkew/__fixtures__/**,proxy.ts
# app/page.tsx, app/privacy/page.tsx, app/terms/page.tsx, and the settings
# domain each hold mirrored { en: {...}, ar: {...} } content dictionaries —
# same keys, different language strings. CPD flags that structural mirroring
# as duplication even though there's no duplicated logic, so these are
# excluded from the check.
# lib/i18n/domains/sales.ts mirrors its EN and AR tables key-for-key, like settings.ts (4a95b591e). SCRUM-724.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,load-tests/**,graphify-out/**,app/page.tsx,app/privacy/page.tsx,app/terms/page.tsx,lib/i18n/domains/settings.ts,lib/i18n/domains/sales.ts

# NOTE: none of the settings in this file take effect while SonarCloud runs in
# Automatic Analysis mode — it does not read sonar-project.properties. CI owns
# analysis instead: .github/workflows/sonar-main.yml scans trusted pushes to
# main, while .github/workflows/sonar-pr-report.yml is a default-branch
# workflow_run that consumes the secretless Tests coverage artifact and scans PR
# source as untrusted data. Direct pull_request workflows never receive
# SONAR_TOKEN. Automatic Analysis must remain disabled while CI analysis is in
# use.

# S6505 ("omitting --ignore-scripts allows lifecycle scripts to run during
# package installation") fires on these two steps because they contain the word
# `install`. It is not a package install: `playwright install` downloads the
# browser binaries that the preceding
# `pnpm install --ignore-scripts` deliberately skipped, and the command does
# not accept `--ignore-scripts`. The actual package installs in every workflow
# do pass it. The equivalent finding on `npx eas-cli` is NOT ignored — that one was
# real, and is now fixed at the source: both invocations pass --ignore-scripts
# alongside the version pin (verified: eas-cli 21.4.0 runs with it set).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/playwright.yml

# SCRUM-784 / SCRUM-350 G4 browser egress proxy. scripts/intelligence/
# browserEgressContainment.mjs IS a deny-by-default forward proxy, so the taint
# rules below describe its function rather than a flaw. Each entry is scoped to
# this one file; the surrounding code is still analysed by every other rule.
#
# S5144 (SSRF): the proxy dials only an exact allowlisted host:port (the
# candidate on loopback, the one Convex preview deployment, the Clerk test
# Frontend API), and only after resolving it to a public address (loopback
# names map to 127.0.0.1). The request URL is checked against that allowlist
# before it is ever used as a destination. SCRUM-784.
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S5144
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/intelligence/browserEgressContainment.mjs
# S5146 (open redirect): relaying the allowlisted upstream's status line and
# headers back to the browser is what a forward proxy does; no Location is
# constructed from the request. SCRUM-784.
sonar.issue.ignore.multicriteria.e3.ruleKey=jssecurity:S5146
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/intelligence/browserEgressContainment.mjs
# S6109 (prototype pollution): `{ ...req.headers }` is an object spread, which
# defines own properties and never invokes a __proto__ setter; the copy is only
# used to drop two hop-by-hop headers before forwarding. SCRUM-784.
sonar.issue.ignore.multicriteria.e4.ruleKey=jssecurity:S6109
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/intelligence/browserEgressContainment.mjs
# S5332 (clear-text http): browserEgressProof.mjs deliberately sends plain-HTTP
# exfiltration probes at a loopback collector. The proof passes only when the
# proxy REFUSES every one of them, so the cleartext URL is the test subject, not
# a transport choice. SCRUM-784.
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=scripts/intelligence/browserEgressProof.mjs
