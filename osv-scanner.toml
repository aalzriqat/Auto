# osv-scanner configuration
#
# The security workflow runs osv-scanner with `--recursive ./`, which sweeps up
# apps/mobile/android/gradle/verification-metadata.xml. That file is Gradle's
# dependency-VERIFICATION checksum list: it records every artifact resolved
# during an Android build, including the buildscript classpath and toolchain —
# not the dependencies the app actually declares or ships.
#
# The practical effect was that the repository's code-scanning view was
# dominated by Maven CVEs (245 io.netty entries and 10 org.bouncycastle entries
# in that one file) for libraries that appear nowhere in
# apps/mobile/android/app/build.gradle and are not present in the released APK.
# Every Critical on the dashboard came from there, which buried the findings
# that are genuinely ours and made the signal unusable for triage.
#
# So Maven findings from that generated file are ignored here. This is
# deliberately narrow:
#   - npm/pnpm scanning is untouched, and remains the coverage that matters for
#     this codebase (the Next.js app, the Convex backend and the Expo JS bundle
#     are all JavaScript).
#   - If a real Android runtime dependency is ever declared in
#     app/build.gradle, it should be scanned. Revisit this the moment the mobile
#     app takes on a first-party native dependency.
[[PackageOverrides]]
ecosystem = "Maven"
ignore = true
reason = "Gradle build-toolchain artifacts from generated verification-metadata.xml; not declared app dependencies and not shipped in the APK."
