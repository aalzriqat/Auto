packages:
  - "apps/*"
  - "packages/*"
overrides:
  undici: ^7.29.0
  # Security overrides — force patched transitive deps flagged by `pnpm audit`.
  sharp: ">=0.35.0"
  # Pinned exact (not a range) so it can't drift onto a release that trips the
  # CI minimumReleaseAge (<24h) supply-chain gate; 8.5.22 is patched (>=8.5.18).
  postcss: 8.5.22
  fast-uri: ">=4.1.2"
  ip-address: ">=10.3.1"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0 <5.0.0"
  # brace-expansion: pin each major line to its own patched release. The 5.x
  # line changed the module's export shape, so it is NOT a drop-in for the
  # old-API CommonJS consumers (minimatch@3 via eslint/exceljs) — forcing 5.x
  # there breaks them with "expand is not a function". Only the new-API >=3 line
  # (minimatch@9 via typescript-eslint) can safely take 5.x.
  "brace-expansion@1": 1.1.18
  "brace-expansion@2": 2.1.4
  "brace-expansion@>=3.0.0": 5.0.9
# GHSA-mh99 (brace-expansion unbounded-expansion DoS) is patched by the pins
# above. Separate per-major overrides remain necessary because minimatch@3's
# old-API CommonJS consumers are incompatible with the 5.x export shape.
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cypress: true
  esbuild: true
  playwright: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  expo-sharing: patches/expo-sharing.patch
