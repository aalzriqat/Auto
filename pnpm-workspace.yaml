packages:
  - "apps/*"
  - "packages/*"
overrides:
  undici: ^7.29.0
  # Security overrides — force patched transitive deps flagged by `pnpm audit`.
  # GHSA-rgj7-g3m4-5g8c: libheif vulnerabilities (GHSA-g89c-p67h-r497,
  # GHSA-2jg2-4ch7-h545) reachable through sharp's bundled libvips. Patched
  # >=0.35.4. The previous >=0.35.0 floor was correct when written and became
  # insufficient with no repository change — the same advisory-database drift
  # documented for nanoid and fast-uri below. Reached only via next's OPTIONAL
  # dependency (next declares sharp ^0.35.3, which 0.35.4 satisfies), used for
  # Next image optimisation. Pinned exact so lockfile regeneration cannot drift
  # onto a release younger than the pnpm 11 minimumReleaseAge (<24h) gate;
  # 0.35.4 was published 2026-08-26.
  sharp: 0.35.4
  # Pinned exact (not a range) so it can't drift onto a release that trips the
  # CI minimumReleaseAge (<24h) supply-chain gate; 8.5.22 is patched (>=8.5.18).
  postcss: 8.5.22
  # GHSA-28wg-ghj8-5hjv (>=3.3.16) and GHSA-2v37-7h3g-55p8: loops in the
  # non-secure and custom generators. The second advisory's affected range was
  # later WIDENED to <3.3.18, so the earlier exact pin of 3.3.17 — correct when
  # it was written — became insufficient with no repository change at all. That
  # is drift in the advisory database, not a bad pin; the defence is periodic
  # re-verification. 3.3.18 was published 2026-08-07, so it now clears the CI
  # minimumReleaseAge (<24h) gate that originally forced the older pin. Still
  # pinned exact, for the same reason as postcss above.
  nanoid: 3.3.18
  # TWO advisory surfaces disagree about this package, and only the stricter
  # one is correct. Both were read from live GitHub at 2026-09-06.
  #
  # 1. The registry-backed global feed — what `pnpm audit` and therefore the
  #    required dependency-audit check query — lists NINE fast-uri advisories.
  #    Four of them fire against the 4.1.2 this repository used to resolve, and
  #    all four name >=4.1.3 as patched:
  #      GHSA-5jgf-p345-68v8  host confusion, skipped IDN canonicalization
  #      GHSA-f65p-4m7j-42xc  SSRF, malformed IPv6 normalization
  #      GHSA-fph4-wmhf-6fwf  SSRF, repeated hostname percent-decoding
  #      GHSA-jqff-g426-hqxp  host confusion, percent-encoded scheme normalization
  #    The other five are patched at or below 4.1.2 and so did not fire.
  #
  # 2. The UPSTREAM REPOSITORY surface — repos/fastify/fast-uri/security-
  #    advisories — lists ELEVEN published advisories. The two the global feed
  #    does NOT carry are exactly the two that make 4.1.3 insufficient:
  #      GHSA-qw65-cvwx-89v3  HIGH  >=4.0.0 <4.1.4   patched 4.1.4
  #      GHSA-58mr-gqgx-xq4g  HIGH  =4.1.3           patched 4.1.4
  #    Both return HTTP 404 from the global advisory API. A 404 there proves
  #    absence FROM THAT DATABASE, not that no advisory exists.
  #
  # So >=4.1.3 is NOT a safe floor: it admits 4.1.3, which two published HIGH
  # advisories affect. 4.1.4 is the first release unaffected by all eleven, and
  # the pin is exact for that SUBSTANTIVE reason — not as a style choice.
  #
  # Consequence worth knowing: the required dependency-audit gate is BLIND to
  # those two, because it queries surface 1 only. Its green says the resolved
  # graph is clean against the feed it reads; it is not evidence that no
  # upstream advisory exists. Tracked as SCRUM-245, not papered over here.
  #
  # Reached through ajv@8 by TWO independent paths. `pnpm why fast-uri -r`
  # resolves ONE instance, not two, so this is a documentation point, not a
  # second exposure (ajv@6, whose only two parents are eslint and
  # @eslint/eslintrc, takes uri-js instead):
  #   @sentry/nextjs > @sentry/webpack-plugin > webpack > schema-utils > ajv
  #   shadcn > @modelcontextprotocol/sdk > ajv
  #
  # Same failure mode as the nanoid pin above: the earlier >=4.1.2 floor was
  # correct when written and became insufficient with no repository change at
  # all, because these advisories landed afterwards. Advisory-database drift,
  # not a bad floor — the defence is periodic re-verification, against BOTH
  # surfaces.
  #
  # A note on the exact form, since postcss/nanoid/browserslist above justify
  # their exact pins by the minimumReleaseAge (<24h) gate: that reason does
  # not apply here and is NOT being borrowed. minimumReleaseAge is pnpm's own
  # RESOLUTION-time policy, and nothing in this repository configures it —
  # there is no .npmrc anywhere in the tree, and this file has no settings
  # block at all (its only top-level keys are packages, overrides,
  # allowBuilds, patchedDependencies and auditConfig). Whether CI should
  # enforce a release-age policy, and by what mechanism, is SCRUM-244's
  # question and is deliberately NOT argued here. This pin is exact because of
  # the advisory ranges above, and would be even if that gate were fully
  # enforced.
  fast-uri: 4.1.4
  ip-address: ">=10.3.1"
  # GHSA-2883-xcg3-v3hh: maxTotalMergeKeys does not limit CPU use for empty
  # merge sources. Patched >=4.3.2 on the 4.x line. The previous selector only
  # matched <4.3.0, so once the graph resolved 4.3.1 it stopped matching at all
  # while 4.3.1 was itself vulnerable — a selector that silently stopped
  # covering the version it was meant to protect. Keyed per-major and pinned
  # exact instead. 4.3.2 published 2026-08-26.
  "js-yaml@4": 4.3.2
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): quadratic CPU consumption in !!omap.
  # The fix was not backported below 3.15.1, and the 3.x line is still pulled in
  # by @istanbuljs/load-nyc-config via the mobile jest preset. Held inside 3.x —
  # 4.x changed the API and is not a drop-in for those CommonJS consumers.
  # Same advisory on the 3.x line, patched >=3.15.2 (the prior >=3.15.1 floor
  # cleared GHSA-5p4m-2wfm-xmqj but not this one). Still held inside 3.x — 4.x
  # changed the API and is not a drop-in for the CommonJS consumers reached via
  # @istanbuljs/load-nyc-config in the mobile jest preset. 3.15.2 published
  # 2026-08-26.
  "js-yaml@3": 3.15.2
  # GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via untrusted
  # browserslist-stats.json in normalizeStats) and GHSA-c83g-rgw3-j3cx
  # (unbounded cache growth -> OOM). Both fixed in >=4.28.7; reached only
  # transitively, via @clerk/nextjs > next > styled-jsx > @babel/core and
  # @sentry/nextjs > @sentry/bundler-plugin-core > @babel/core.
  #
  # Pinned exact for the same reason as postcss and nanoid above: a range
  # lets lockfile regeneration drift onto a release younger than the CI
  # minimumReleaseAge (<24h) supply-chain gate. 4.28.8 was published
  # 2026-08-08 and clears it comfortably.
  #
  # NOT added to auditConfig.ignoreGhsas: a patched, compatible release
  # exists, so an override is the correct remedy and an ignore would be
  # suppressing a fixable advisory. Note the PATCH predates the ADVISORY by
  # six weeks (4.28.7 shipped 2026-07-21, both GHSAs 2026-09-01) — this is
  # advisory-database drift, not a dependency we let rot.
  browserslist: 4.28.8
  # Collateral to the pin above, and required for it to be INSTALLABLE rather
  # than merely correct. browserslist 4.28.8 requires electron-to-chromium
  # ^1.5.402, so the old 1.5.371 this repo carried cannot satisfy it — and a
  # fresh resolution takes the newest match, which on the day this was written
  # was 1.5.419, published hours earlier. CI runs pnpm 11, whose supply-chain
  # policy REJECTS any entry younger than 24h:
  #
  #   ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
  #   electron-to-chromium@1.5.419 published 2026-09-01T18:02:46Z,
  #   within the minimumReleaseAge cutoff
  #
  # 1.5.417 (published 2026-08-31) is the newest release that both satisfies
  # ^1.5.402 and clears the age gate.
  #
  # This pin is a RESOLUTION-DATE artifact, not a security pin: it exists
  # because the lockfile was regenerated on the day a new release landed.
  # Once the lockfile is committed it stays put, so this may be raised or
  # dropped whenever electron-to-chromium is next revisited — unlike the
  # postcss/nanoid pins above, nothing here is defending against a CVE.
  electron-to-chromium: 1.5.417
  # brace-expansion: pin each major line to its own patched release. The 5.x
  # line changed the module's export shape, so it is NOT a drop-in for the
  # old-API CommonJS consumers (minimatch@3 via eslint/exceljs) — forcing 5.x
  # there breaks them with "expand is not a function". Only the new-API >=3 line
  # (minimatch@9 via typescript-eslint) can safely take 5.x.
  "brace-expansion@1": 1.1.18
  "brace-expansion@2": 2.1.4
  "brace-expansion@>=3.0.0": 5.0.9
  # @xmldom/xmldom: pin each line to its own patched release. Fourteen
  # advisories — 13 HIGH and one medium — were published against this
  # package on 2026-09-08, between 20:30:51Z and 21:03:28Z,
  # which broke the repo-wide required dependency-audit check with no dependency
  # change anywhere in the repository — the fifth instance of the class tracked
  # as SCRUM-244. This is SCRUM-307.
  #
  # The graph resolves TWO independent copies, not one, and they are NOT
  # interchangeable:
  #
  #   @expo/plist@0.8.0 -> ^0.8.8   (was 0.8.13)  -- patched floor 0.8.15
  #   plist@3.1.1       -> ^0.9.10  (was 0.9.10)  -- patched floor 0.9.12
  #
  # Both floors were verified against BOTH advisory surfaces on 2026-09-09 (the
  # SCRUM-245 lesson — the global feed and the upstream repository surface
  # disagreed about fast-uri, and only the stricter one was right).
  #
  # They DISAGREE here too, and the disagreement is recorded rather than
  # smoothed over. The global feed — what `pnpm audit`, and therefore the
  # required check, actually queries — carries 23 entries affecting this
  # package, one of which (GHSA-9pgh-qqpf-7wqj) it marks withdrawn. The
  # upstream repository surface carries 24 advisories, ALL of them still
  # state=published with no withdrawal recorded — including that same one —
  # of which 22 name @xmldom/xmldom (the other two name only the legacy
  # unscoped `xmldom` package).
  #
  # That disagreement is MOOT for this pin: GHSA-9pgh-qqpf-7wqj covers
  # < 0.7.6, >= 0.8.0 < 0.8.3 and = 0.9.0-beta.1, all far below both floors.
  # What the two surfaces DO agree on is the part that decides the pin: on
  # each of them the highest patched floor is 0.8.15 for the 0.8 line and
  # 0.9.12 for the 0.9 line, and no advisory on either surface affects
  # 0.8.15 or 0.9.12.
  #
  # A single unqualified `0.9.12` override does NOT work, and this was proven by
  # execution rather than by reading semver. @expo/plist calls
  #   new DOMParser({ errorHandler() {} }).parseFromString(xml)
  # with ONE argument; xmldom 0.9 made the mimeType argument mandatory. Forcing
  # @expo/plist onto 0.9.12 therefore fails at runtime with
  #   TypeError: DOMParser.parseFromString: the provided mimeType "undefined"
  #   is not valid.
  # and the same fixture parses correctly on 0.8.15. That is a hard break in the
  # Expo config/prebuild toolchain, not a style objection, so the 0.8 line is
  # held at its own patched floor — exactly the reasoning already applied to
  # brace-expansion and js-yaml above.
  #
  # Pinned exact, like postcss/nanoid/browserslist, so lockfile regeneration
  # cannot drift onto a release younger than the pnpm 11 minimumReleaseAge
  # (<24h) supply-chain gate. Both releases published 2026-08-21 and clear it.
  #
  # NOT added to auditConfig.ignoreGhsas: patched, compatible releases exist, so
  # an override is the correct remedy and an ignore would suppress a fixable
  # advisory.
  "@xmldom/xmldom@0.8": 0.8.15
  "@xmldom/xmldom@0.9": 0.9.12
# GHSA-mh99 (brace-expansion unbounded-expansion DoS) is patched by the pins
# above. Separate per-major overrides remain necessary because minimatch@3's
# old-API CommonJS consumers are incompatible with the 5.x export shape.
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cypress: true
  esbuild: true
  playwright: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  expo-sharing: patches/expo-sharing.patch
auditConfig:
  # image-size parser DoS (ICNS, and JXL/HEIF). Both advisories name >=2.0.3 as
  # the patched version, but that release does not exist — npm's latest is
  # 2.0.2, which is itself in the vulnerable range — so no override or bump can
  # clear these. They reach us only through
  #   apps/mobile > @clerk/expo > @clerk/clerk-js > @solana/wallet-adapter-react
  #   > @solana-mobile/... > react-native > metro > image-size
  # where Metro reads image dimensions at build time from assets in this repo,
  # not from attacker-supplied input at runtime. The cost of a parser DoS there
  # is a hung build, not production availability.
  #
  # Ignored individually rather than by lowering --audit-level, so every other
  # high advisory still fails the required dependency-audit check. Remove these
  # once image-size 2.0.3 ships and Metro picks it up.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
