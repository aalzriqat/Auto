packages:
  - "apps/*"
  - "packages/*"
overrides:
  undici: ^7.29.0
  # Security overrides — force patched transitive deps flagged by `pnpm audit`.
  sharp: ">=0.35.0"
  # Pinned exact (not a range) so it can't drift onto a release that trips the
  # CI minimumReleaseAge (<24h) supply-chain gate; 8.5.22 is patched (>=8.5.18).
  postcss: 8.5.22
  # GHSA-28wg-ghj8-5hjv (>=3.3.16) and GHSA-2v37-7h3g-55p8: loops in the
  # non-secure and custom generators. The second advisory's affected range was
  # later WIDENED to <3.3.18, so the earlier exact pin of 3.3.17 — correct when
  # it was written — became insufficient with no repository change at all. That
  # is drift in the advisory database, not a bad pin; the defence is periodic
  # re-verification. 3.3.18 was published 2026-08-07, so it now clears the CI
  # minimumReleaseAge (<24h) gate that originally forced the older pin. Still
  # pinned exact, for the same reason as postcss above.
  nanoid: 3.3.18
  # SIX HIGH advisories affected 4.x versions that the successive >=4.1.2 and
  # >=4.1.3 floors ADMITTED. The pinned 4.1.4 is affected by none of them — that
  # is the point of the pin, not an accident. (fastify/fast-uri lists ELEVEN
  # advisories overall; the other five are patched at or below 4.1.2.)
  #
  # Patched at 4.1.3 — visible to `pnpm audit`, and what the >=4.1.2 floor admitted:
  #   GHSA-5jgf-p345-68v8  host confusion, skipped IDN canonicalization
  #   GHSA-f65p-4m7j-42xc  SSRF, malformed IPv6 normalization
  #   GHSA-fph4-wmhf-6fwf  SSRF, repeated hostname percent-decoding
  #   GHSA-jqff-g426-hqxp  host confusion, percent-encoded scheme normalization
  #
  # Patched at 4.1.4 — and INVISIBLE to the audit gate. This is why the pin is
  # exact rather than a >=4.1.3 range:
  #   GHSA-qw65-cvwx-89v3  authority injection      >= 4.0.0, < 4.1.4
  #   GHSA-58mr-gqgx-xq4g  host confusion, unclosed bracket   = 4.1.3
  #
  # ⚠️ THE REQUIRED dependency-audit GATE CANNOT SEE THE LAST TWO. They are
  # PUBLISHED REPOSITORY advisories on fastify/fast-uri, which the GLOBAL
  # advisory database has not ingested:
  #
  #   gh api repos/fastify/fast-uri/security-advisories   -> ELEVEN, both present
  #   gh api advisories/GHSA-qw65-cvwx-89v3               -> 404
  #   gh api 'advisories?ecosystem=npm&affects=fast-uri'  -> NINE, neither present
  #
  # `pnpm audit` reads that same global data, so it is GREEN on the vulnerable
  # 4.1.3. A green dependency-audit on this package is evidence about advisory
  # INGESTION, not about dependency safety. Do not relax this pin on the
  # strength of a green gate.
  #
  # An earlier revision of this comment asserted the opposite — "nine in total",
  # "no advisory requiring 4.1.4" — because it was written from the global
  # endpoints alone, and a review finding that named these two correctly was
  # rejected as fabricated on that basis. One database answering "not found" is
  # not absence; it is one database. See SCRUM-242 c17610.
  #
  # Reached through ajv by TWO independent paths. `pnpm why fast-uri -r`
  # resolves ONE instance, not two, so this is a documentation point, not a
  # second exposure:
  #   @sentry/nextjs > @sentry/webpack-plugin > webpack > schema-utils > ajv
  #   shadcn > @modelcontextprotocol/sdk > ajv
  #
  # Same failure mode as the nanoid pin above: the earlier >=4.1.2 floor was
  # correct when written and became insufficient with no repository change at
  # all, because these advisories landed afterwards. Advisory-database drift,
  # not a bad floor — the defence is periodic re-verification.
  #
  # Pinned EXACT for TWO independent reasons, either of which suffices.
  #
  # 1. SUBSTANTIVE: >=4.1.3 permits 4.1.3, which GHSA-58mr-gqgx-xq4g affects
  #    directly. The safe range form would be >=4.1.4; the exact pin is
  #    stricter and moves no package, since 4.1.4 is already what the range
  #    resolved to. This is not a stylistic preference.
  #
  # 2. MECHANICAL: minimumReleaseAge (<24h) is pnpm's own RESOLUTION-time
  #    policy, and every install under .github/workflows is
  #    `pnpm install --frozen-lockfile` (14x across test/security/playwright/
  #    eas-update/deploy-production/build-apk) or `npm ci` (2x) — none of which
  #    resolves anything. CI therefore never exercises that gate and cannot be
  #    what protects a floating range; the only protection would be whoever
  #    regenerates the lockfile happening to run a pnpm that enforces it. An
  #    exact pin does not depend on that. Making the policy actually
  #    enforceable is SCRUM-244.
  fast-uri: 4.1.4
  ip-address: ">=10.3.1"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0 <5.0.0"
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): quadratic CPU consumption in !!omap.
  # The fix was not backported below 3.15.1, and the 3.x line is still pulled in
  # by @istanbuljs/load-nyc-config via the mobile jest preset. Held inside 3.x —
  # 4.x changed the API and is not a drop-in for those CommonJS consumers.
  "js-yaml@3": ">=3.15.1 <4.0.0"
  # GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via untrusted
  # browserslist-stats.json in normalizeStats) and GHSA-c83g-rgw3-j3cx
  # (unbounded cache growth -> OOM). Both fixed in >=4.28.7; reached only
  # transitively, via @clerk/nextjs > next > styled-jsx > @babel/core and
  # @sentry/nextjs > @sentry/bundler-plugin-core > @babel/core.
  #
  # Pinned exact for the same reason as postcss and nanoid above: a range
  # lets lockfile regeneration drift onto a release younger than the CI
  # minimumReleaseAge (<24h) supply-chain gate. 4.28.8 was published
  # 2026-08-08 and clears it comfortably.
  #
  # NOT added to auditConfig.ignoreGhsas: a patched, compatible release
  # exists, so an override is the correct remedy and an ignore would be
  # suppressing a fixable advisory. Note the PATCH predates the ADVISORY by
  # six weeks (4.28.7 shipped 2026-07-21, both GHSAs 2026-09-01) — this is
  # advisory-database drift, not a dependency we let rot.
  browserslist: 4.28.8
  # Collateral to the pin above, and required for it to be INSTALLABLE rather
  # than merely correct. browserslist 4.28.8 requires electron-to-chromium
  # ^1.5.402, so the old 1.5.371 this repo carried cannot satisfy it — and a
  # fresh resolution takes the newest match, which on the day this was written
  # was 1.5.419, published hours earlier. CI runs pnpm 11, whose supply-chain
  # policy REJECTS any entry younger than 24h:
  #
  #   ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
  #   electron-to-chromium@1.5.419 published 2026-09-01T18:02:46Z,
  #   within the minimumReleaseAge cutoff
  #
  # 1.5.417 (published 2026-08-31) is the newest release that both satisfies
  # ^1.5.402 and clears the age gate.
  #
  # This pin is a RESOLUTION-DATE artifact, not a security pin: it exists
  # because the lockfile was regenerated on the day a new release landed.
  # Once the lockfile is committed it stays put, so this may be raised or
  # dropped whenever electron-to-chromium is next revisited — unlike the
  # postcss/nanoid pins above, nothing here is defending against a CVE.
  electron-to-chromium: 1.5.417
  # brace-expansion: pin each major line to its own patched release. The 5.x
  # line changed the module's export shape, so it is NOT a drop-in for the
  # old-API CommonJS consumers (minimatch@3 via eslint/exceljs) — forcing 5.x
  # there breaks them with "expand is not a function". Only the new-API >=3 line
  # (minimatch@9 via typescript-eslint) can safely take 5.x.
  "brace-expansion@1": 1.1.18
  "brace-expansion@2": 2.1.4
  "brace-expansion@>=3.0.0": 5.0.9
# GHSA-mh99 (brace-expansion unbounded-expansion DoS) is patched by the pins
# above. Separate per-major overrides remain necessary because minimatch@3's
# old-API CommonJS consumers are incompatible with the 5.x export shape.
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cypress: true
  esbuild: true
  playwright: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  expo-sharing: patches/expo-sharing.patch
auditConfig:
  # image-size parser DoS (ICNS, and JXL/HEIF). Both advisories name >=2.0.3 as
  # the patched version, but that release does not exist — npm's latest is
  # 2.0.2, which is itself in the vulnerable range — so no override or bump can
  # clear these. They reach us only through
  #   apps/mobile > @clerk/expo > @clerk/clerk-js > @solana/wallet-adapter-react
  #   > @solana-mobile/... > react-native > metro > image-size
  # where Metro reads image dimensions at build time from assets in this repo,
  # not from attacker-supplied input at runtime. The cost of a parser DoS there
  # is a hung build, not production availability.
  #
  # Ignored individually rather than by lowering --audit-level, so every other
  # high advisory still fails the required dependency-audit check. Remove these
  # once image-size 2.0.3 ships and Metro picks it up.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
