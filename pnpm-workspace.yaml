packages:
  - "apps/*"
  - "packages/*"
overrides:
  undici: ^7.28.0
  # Security overrides — force patched transitive deps flagged by `pnpm audit`.
  # brace-expansion 5.0.8 is dual-published (CJS + ESM), so it's a safe drop-in
  # for CommonJS consumers (minimatch@3) and clears every brace-expansion
  # advisory, including GHSA-mh99 which has no fix on the 1.x/2.x lines.
  sharp: ">=0.35.0"
  # Pinned exact (not a range) so it can't drift onto a release that trips the
  # CI minimumReleaseAge (<24h) supply-chain gate; 8.5.22 is patched (>=8.5.18).
  postcss: 8.5.22
  fast-uri: ">=3.1.4"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0"
  brace-expansion: 5.0.8
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cypress: true
  esbuild: true
  playwright: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  expo-sharing: patches/expo-sharing.patch
